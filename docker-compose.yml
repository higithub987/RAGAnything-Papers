services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    pull_policy: never
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=localhost:2379", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:latest
    pull_policy: never
    environment:
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.13
    pull_policy: never
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      COMMON_STORAGETYPE: minio
      COMMON_METRICSPORT: 9091
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEYID: minioadmin
      MINIO_SECRET_ACCESSKEY: minioadmin
      MINIO_USE_SSL: "false"
      QUERYNODE_GRACEFULSTOPTIMEOUT: 30s
      DATANODE_GRACEFULSTOPTIMEOUT: 30s
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    command: milvus run standalone
    healthcheck:
      # Milvus is query-ready (not just container-up) once /healthz on the
      # metrics port returns 200. Gate consumers on `condition: service_healthy`
      # and/or start the API only after `docker compose ps` shows milvus healthy.
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  etcd_data:
  minio_data:
  milvus_data:
