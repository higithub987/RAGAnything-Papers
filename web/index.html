<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG-Anything Query</title>
<link rel="stylesheet" href="/shared.css">
<style>
  .page {
    display: flex;
    flex-direction: column;
  }
  body {
    align-items: stretch;
  }
  .layout {
    display: flex;
    gap: 2vw;
    flex: 1;
    min-height: 0;
  }
  .sidebar {
    flex: 0 0 22%;
    min-width: 0;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 1vh;
    overflow-y: auto;
  }
  .sidebar > button {
    flex: 0 0 auto;
    width: 100%;
  }
  .layout.query-mode .sidebar {
    display: none;
  }
  .chat-list {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    min-height: 0;
  }
  .chat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: #374151;
  }
  .chat-item:hover {
    background: #f4f5f7;
  }
  .chat-item.active {
    background: #eff6ff;
    color: #1e3a8a;
    font-weight: 600;
  }
  .chat-item-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chat-item .rename-btn {
    flex: 0 0 auto;
    background: none;
    border: none;
    padding: 2px 4px;
    font-size: 12px;
    color: #6b7280;
    cursor: pointer;
  }
  .chat-item .rename-btn:hover {
    color: #374151;
  }
  .card {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    min-height: 96px;
    padding: 12px;
    font-size: 15px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    resize: vertical;
    box-sizing: border-box;
    font-family: inherit;
  }
  textarea:focus, select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .row {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    margin-top: 16px;
  }
  .mode-field {
    flex: 0 0 160px;
  }
  select {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #fff;
    color: #1a1a1a;
  }
  button {
    flex: 1;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) {
    background: #1d4ed8;
  }
  button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }
  .result {
    margin-top: 24px;
    padding: 16px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.5;
    display: none;
  }
  .result.visible {
    display: block;
  }
  .result.loading,
  .result.error {
    white-space: pre-wrap;
  }
  .result.answer > *:first-child {
    margin-top: 0;
  }
  .result.answer > *:last-child {
    margin-bottom: 0;
  }
  .result.answer h1,
  .result.answer h2,
  .result.answer h3 {
    margin: 16px 0 8px;
    line-height: 1.3;
  }
  .result.answer h1 { font-size: 18px; }
  .result.answer h2 { font-size: 16px; }
  .result.answer h3 { font-size: 15px; }
  .result.answer p {
    margin: 0 0 10px;
  }
  .result.answer ul,
  .result.answer ol {
    margin: 0 0 10px;
    padding-left: 22px;
  }
  .result.answer li {
    margin-bottom: 4px;
  }
  .result.answer strong {
    font-weight: 700;
  }
  .result.answer {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #14532d;
  }
  .result.error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
  }
  .result.loading {
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    color: #4b5563;
  }
  .result.question {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e3a8a;
    font-weight: 600;
  }
  #messages {
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 0;
  }
  #query-form {
    flex: 0 0 auto;
  }
  .history-actions {
    margin-bottom: 16px;
    text-align: right;
    flex: 0 0 auto;
  }
  .card:not(.query-mode) .history-actions {
    display: none;
  }
  .card.query-mode {
    height: auto;
  }
  .card.query-mode #query-form {
    order: 1;
  }
  .card.query-mode #messages {
    order: 2;
    flex: 0 0 auto;
    overflow: visible;
  }
  .card.query-mode .history-actions {
    order: 3;
  }
  .clear-btn {
    background: none;
    border: none;
    color: #6b7280;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 0;
    flex: none;
  }
  .clear-btn:hover {
    color: #374151;
    background: none;
  }
  .mode-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-toggle button {
    flex: 1;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
    background: #fff;
    border: none;
    border-radius: 0;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .mode-toggle button:hover:not(.active) {
    background: #f4f5f7;
  }
  .mode-toggle button.active {
    background: #2563eb;
    color: #fff;
  }
  .mode-toggle button + button {
    border-left: 1px solid #d1d5db;
  }
</style>
</head>
<body>
  <div class="page">
  <nav class="nav">
    <a href="/documents.html">Documents</a>
    <a href="/" class="active">Chat</a>
  </nav>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <button type="button" id="new-chat-btn">+ New Chat</button>
      <div class="chat-list" id="chat-list"></div>
    </aside>
    <div class="card">
      <h1>Ask your documents</h1>
      <p class="subtitle">Query your RAG-Anything knowledge base.</p>

      <div class="mode-toggle" id="mode-toggle">
        <button type="button" id="chat-mode-btn" data-mode="chat">Chat</button>
        <button type="button" id="query-mode-btn" data-mode="query">Query</button>
      </div>

      <div id="messages"></div>
      <div class="history-actions">
        <button type="button" id="clear-btn" class="clear-btn">Clear history</button>
      </div>

      <form id="query-form">
        <label for="query">Query</label>
        <textarea id="query" name="query" placeholder="What would you like to know?" required></textarea>

        <div class="row">
          <div class="mode-field">
            <label for="mode">Mode</label>
            <select id="mode" name="mode">
              <option value="hybrid" selected>hybrid</option>
              <option value="local">local</option>
              <option value="global">global</option>
              <option value="naive">naive</option>
              <option value="mix">mix</option>
              <option value="bypass">bypass</option>
            </select>
          </div>
          <button type="submit" id="submit-btn">Ask</button>
        </div>
      </form>
    </div>
  </div>
  </div>

  <script>
    const form = document.getElementById("query-form");
    const submitBtn = document.getElementById("submit-btn");
    const messagesEl = document.getElementById("messages");
    const clearBtn = document.getElementById("clear-btn");
    const modeToggle = document.getElementById("mode-toggle");
    const modeButtons = modeToggle.querySelectorAll("button");
    const card = document.querySelector(".card");
    const layout = document.getElementById("layout");
    const chatList = document.getElementById("chat-list");
    const newChatBtn = document.getElementById("new-chat-btn");

    const ACTIVE_MODE_KEY = "ragActiveMode";
    const CURRENT_SESSION_KEY = "ragCurrentSessionId";

    function storageKeyForMode(viewMode) {
      return `ragMessages_${viewMode}`;
    }

    function loadMessages(viewMode) {
      try {
        return JSON.parse(sessionStorage.getItem(storageKeyForMode(viewMode))) || [];
      } catch {
        return [];
      }
    }

    function saveMessages(viewMode, turnsToSave) {
      sessionStorage.setItem(storageKeyForMode(viewMode), JSON.stringify(turnsToSave));
    }

    let currentMode = sessionStorage.getItem(ACTIVE_MODE_KEY) || "chat";
    let turns = currentMode === "query" ? loadMessages(currentMode) : [];
    let currentSessionId = sessionStorage.getItem(CURRENT_SESSION_KEY) || null;

    // Chat-mode conversations live server-side (api/session_store.py): the
    // server owns the rolling-history window/summary and naming, and clears
    // all chats when it restarts. The client just tracks which session is
    // active and renders whatever turns/title the server reports for it.
    async function fetchSessions() {
      const response = await fetch("/sessions");
      return response.ok ? response.json() : [];
    }

    async function createSession() {
      const response = await fetch("/sessions", { method: "POST" });
      const data = await response.json();
      return data.session_id;
    }

    async function fetchSessionTurns(sessionId) {
      const response = await fetch(`/sessions/${sessionId}`);
      if (!response.ok) return [];
      const data = await response.json();
      return data.turns
        .map((t) => ({ query: t.query, text: t.answer, kind: "answer" }))
        .reverse();
    }

    function renderChatList(sessions) {
      chatList.innerHTML = "";
      for (const session of sessions) {
        const item = document.createElement("div");
        item.className = "chat-item" + (session.session_id === currentSessionId ? " active" : "");
        item.dataset.sessionId = session.session_id;

        const nameSpan = document.createElement("span");
        nameSpan.className = "chat-item-name";
        nameSpan.textContent = session.title;
        item.appendChild(nameSpan);

        const renameBtn = document.createElement("button");
        renameBtn.type = "button";
        renameBtn.className = "rename-btn";
        renameBtn.textContent = "✎";
        item.appendChild(renameBtn);

        chatList.appendChild(item);
      }
    }

    chatList.addEventListener("click", async (event) => {
      const item = event.target.closest(".chat-item");
      if (!item) return;
      const sessionId = item.dataset.sessionId;

      if (event.target.closest(".rename-btn")) {
        const nameSpan = item.querySelector(".chat-item-name");
        const newName = window.prompt("Rename chat", nameSpan ? nameSpan.textContent : "");
        if (newName === null) return;
        const response = await fetch(`/sessions/${sessionId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: newName.trim() }),
        });
        if (response.ok) renderChatList(await fetchSessions());
        return;
      }

      if (sessionId === currentSessionId) return;
      currentSessionId = sessionId;
      sessionStorage.setItem(CURRENT_SESSION_KEY, currentSessionId);
      turns = await fetchSessionTurns(currentSessionId);
      renderMessages();
      for (const el of chatList.querySelectorAll(".chat-item")) {
        el.classList.toggle("active", el.dataset.sessionId === currentSessionId);
      }
    });

    newChatBtn.addEventListener("click", async () => {
      currentSessionId = await createSession();
      sessionStorage.setItem(CURRENT_SESSION_KEY, currentSessionId);
      turns = [];
      renderMessages();
      renderChatList(await fetchSessions());
    });

    async function initChatMode() {
      const sessions = await fetchSessions();
      const exists = sessions.some((s) => s.session_id === currentSessionId);
      if (!currentSessionId || !exists) {
        currentSessionId = await createSession();
        sessionStorage.setItem(CURRENT_SESSION_KEY, currentSessionId);
        sessions.unshift({ session_id: currentSessionId, title: "New Chat" });
      }
      renderChatList(sessions);
      turns = await fetchSessionTurns(currentSessionId);
      renderMessages();
    }

    async function setActiveMode(viewMode) {
      currentMode = viewMode;
      sessionStorage.setItem(ACTIVE_MODE_KEY, viewMode);
      card.classList.toggle("query-mode", viewMode === "query");
      layout.classList.toggle("query-mode", viewMode === "query");
      for (const btn of modeButtons) {
        btn.classList.toggle("active", btn.dataset.mode === viewMode);
      }
      if (viewMode === "chat") {
        await initChatMode();
      } else {
        turns = loadMessages(viewMode);
        renderMessages();
      }
    }

    modeToggle.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-mode]");
      if (btn) setActiveMode(btn.dataset.mode);
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderInline(text) {
      return escapeHtml(text).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderMarkdown(markdown) {
      const lines = markdown.split("\n");
      const html = [];
      let listType = null; // "ul" | "ol" | null
      let paragraph = [];

      const flushParagraph = () => {
        if (paragraph.length) {
          html.push(`<p>${paragraph.join(" ")}</p>`);
          paragraph = [];
        }
      };
      const closeList = () => {
        if (listType) {
          html.push(`</${listType}>`);
          listType = null;
        }
      };

      for (const rawLine of lines) {
        const line = rawLine.trim();

        if (!line) {
          flushParagraph();
          closeList();
          continue;
        }

        const headingMatch = line.match(/^(#{1,3})\s+(.*)/);
        if (headingMatch) {
          flushParagraph();
          closeList();
          const level = headingMatch[1].length;
          html.push(`<h${level}>${renderInline(headingMatch[2])}</h${level}>`);
          continue;
        }

        const bulletMatch = line.match(/^[*-]\s+(.*)/);
        const numberedMatch = line.match(/^\d+[.)]\s+(.*)/);
        if (bulletMatch || numberedMatch) {
          flushParagraph();
          const wantedType = bulletMatch ? "ul" : "ol";
          if (listType !== wantedType) {
            closeList();
            html.push(`<${wantedType}>`);
            listType = wantedType;
          }
          html.push(`<li>${renderInline((bulletMatch || numberedMatch)[1])}</li>`);
          continue;
        }

        closeList();
        paragraph.push(renderInline(line));
      }

      flushParagraph();
      closeList();
      return html.join("");
    }

    function scrollMessagesToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderMessages() {
      messagesEl.innerHTML = "";
      if (!turns.length) {
        const emptyState = document.createElement("p");
        emptyState.className = "empty-state";
        emptyState.textContent =
          currentMode === "query"
            ? "No query yet — ask a question to get started."
            : "No messages yet — ask a question to get started.";
        messagesEl.appendChild(emptyState);
        return;
      }
      for (const turn of [...turns].reverse()) {
        const questionBubble = document.createElement("div");
        questionBubble.className = "result visible question";
        questionBubble.textContent = turn.query;
        messagesEl.appendChild(questionBubble);

        const responseBubble = document.createElement("div");
        responseBubble.className = `result visible ${turn.kind}`;
        if (turn.kind === "answer") {
          responseBubble.innerHTML = renderMarkdown(turn.text);
        } else {
          responseBubble.textContent = turn.text;
        }
        messagesEl.appendChild(responseBubble);
      }
      scrollMessagesToBottom();
    }

    card.classList.toggle("query-mode", currentMode === "query");
    layout.classList.toggle("query-mode", currentMode === "query");
    for (const btn of modeButtons) {
      btn.classList.toggle("active", btn.dataset.mode === currentMode);
    }
    if (currentMode === "chat") {
      initChatMode();
    } else {
      renderMessages();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const query = document.getElementById("query").value.trim();
      const mode = document.getElementById("mode").value;
      if (!query) return;

      submitBtn.disabled = true;
      const turn = { query, kind: "loading", text: "Thinking…" };
      if (currentMode === "query") {
        turns = [turn];
      } else {
        turns.unshift(turn);
      }
      renderMessages();
      if (currentMode === "query") saveMessages(currentMode, turns);

      try {
        const requestBody =
          currentMode === "chat"
            ? { query, mode, session_id: currentSessionId }
            : { query, mode, conversation_history: [] };
        const response = await fetch("/query/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody),
        });

        if (!response.ok) {
          // Errors raised before streaming starts (e.g. init failures) come
          // back as a normal JSON error body, same shape as /query's.
          let detail = `Request failed (${response.status})`;
          try {
            const data = await response.json();
            detail = data.detail || detail;
          } catch (_) {
            // Body wasn't JSON -- keep the generic message.
          }
          throw new Error(detail);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let accumulated = "";
        let streamDone = false;

        while (!streamDone) {
          const { done, value } = await reader.read();
          streamDone = done;
          if (value) {
            accumulated += decoder.decode(value, { stream: true });
            turn.kind = "answer";
            turn.text = accumulated;
            renderMessages();
          }
        }
        accumulated += decoder.decode();
        turn.kind = "answer";
        turn.text = accumulated;
        renderMessages();
        if (currentMode === "query") saveMessages(currentMode, turns);
      } catch (err) {
        turn.kind = "error";
        turn.text = err.message || "Something went wrong.";
        renderMessages();
        if (currentMode === "query") saveMessages(currentMode, turns);
      } finally {
        submitBtn.disabled = false;
      }
    });

    clearBtn.addEventListener("click", () => {
      turns = [];
      sessionStorage.removeItem(storageKeyForMode(currentMode));
      renderMessages();
    });
  </script>
</body>
</html>
