<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG-Anything Query</title>
<script>
  (function () {
    const saved = localStorage.getItem("ragTheme");
    const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<link rel="icon" href="data:,">
<style>
  html, body {
    height: 100%;
    overflow: hidden;
  }
  .page {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  body {
    align-items: stretch;
  }
  .layout {
    display: flex;
    gap: 2vw;
    flex: 1;
    min-height: 0;
  }
  .sidebar {
    flex: 0 0 22%;
    min-width: 0;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--card-shadow);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 1vh;
    overflow-y: auto;
  }
  .sidebar > button {
    flex: 0 0 auto;
    width: 100%;
  }
  #new-chat-btn {
    background: transparent;
    color: var(--blue);
    border: 1px solid var(--blue);
  }
  #new-chat-btn:hover:not(:disabled) {
    background: var(--accent-soft-bg);
  }
  .layout.query-mode .sidebar {
    display: none;
  }
  .chat-list {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    min-height: 0;
  }
  .chat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-strong);
  }
  .chat-item:hover {
    background: var(--bg);
  }
  .chat-item.active {
    background: var(--accent-soft-bg);
    color: var(--accent-text-strong);
    font-weight: 600;
  }
  .chat-item-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chat-item .rename-btn,
  .chat-item .delete-btn {
    flex: 0 0 auto;
    background: none;
    border: none;
    padding: 2px 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .chat-item:hover .rename-btn,
  .chat-item:hover .delete-btn {
    opacity: 1;
  }
  .chat-item .rename-btn {
    font-size: 12px;
    color: var(--text-muted);
  }
  .chat-item .rename-btn:hover {
    color: var(--text-strong);
  }
  .chat-item .delete-btn {
    font-size: 14px;
    color: var(--text-muted);
  }
  .chat-item .delete-btn:hover {
    color: var(--danger-text);
  }
  .card {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .card h1 {
    flex: 0 0 auto;
    font-size: 16px;
    margin: 0 0 2px;
  }
  .card p.subtitle {
    flex: 0 0 auto;
    font-size: 12px;
    margin: 0 0 10px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-strong);
    margin-bottom: 4px;
  }
  textarea {
    width: 100%;
    min-height: 64px;
    padding: 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    resize: vertical;
    box-sizing: border-box;
    font-family: inherit;
    margin-bottom: 6px;
    background: var(--surface);
    color: var(--text);
  }
  textarea:focus, select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-shadow);
  }
  .row {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    justify-content: flex-end;
  }
  .mode-field {
    flex: 0 0 160px;
  }
  select {
    width: 100%;
    padding: 7px 10px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
  }
  button {
    flex: 1;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--blue);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) {
    background: var(--blue-dark);
  }
  button:disabled {
    background: var(--text-faint);
    cursor: not-allowed;
  }
  #submit-btn {
    flex: 0 0 auto;
    padding: 8px 20px;
  }
  #messages {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 0;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.55;
    word-break: break-word;
    border-radius: 14px;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--blue);
    color: #fff;
    border-radius: 14px 14px 2px 14px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--surface-subtle);
    border: 1px solid var(--border-soft);
    color: var(--text);
    border-radius: 2px 14px 14px 14px;
  }
  .bubble.assistant.loading {
    color: var(--text-muted);
    font-style: italic;
  }
  .bubble.assistant.error {
    background: var(--danger-bg);
    border-color: var(--danger-border);
    color: var(--danger-text);
  }
  .bubble.assistant > *:first-child { margin-top: 0; }
  .bubble.assistant > *:last-child  { margin-bottom: 0; }
  .bubble.assistant h1 { font-size: 15px; margin: 14px 0 6px; line-height: 1.3; }
  .bubble.assistant h2 { font-size: 14px; margin: 12px 0 5px; line-height: 1.3; }
  .bubble.assistant h3 { font-size: 13px; margin: 10px 0 4px; line-height: 1.3; }
  .bubble.assistant p  { margin: 0 0 8px; }
  .bubble.assistant ul,
  .bubble.assistant ol { margin: 0 0 8px; padding-left: 20px; }
  .bubble.assistant li { margin-bottom: 3px; }
  .bubble.assistant strong { font-weight: 700; }
  #messages {
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 0;
  }
  #query-form {
    flex: 0 0 auto;
  }
  .history-actions {
    margin-bottom: 16px;
    text-align: right;
    flex: 0 0 auto;
  }
  .card:not(.query-mode) .history-actions {
    display: none;
  }
  .card.query-mode #query-form {
    order: 1;
  }
  .card.query-mode #messages {
    order: 2;
  }
  .card.query-mode .history-actions {
    order: 3;
  }
  .clear-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 0;
    flex: none;
  }
  .clear-btn:hover {
    color: var(--text-strong);
    background: none;
  }
  .mode-toggle {
    flex: 0 0 auto;
    display: flex;
    gap: 0;
    margin-bottom: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-toggle button {
    flex: 1;
    padding: 4px 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-strong);
    background: var(--surface);
    border: none;
    border-radius: 0;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .mode-toggle button:hover:not(.active) {
    background: var(--bg);
  }
  .mode-toggle button.active {
    background: var(--blue);
    color: #fff;
  }
  .mode-toggle button + button {
    border-left: 1px solid var(--border);
  }
  .think-field {
    flex: 0 0 auto;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg button {
    flex: 0 0 auto;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-strong);
    background: var(--surface);
    border: none;
    border-radius: 0;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .seg button:hover:not(.active) {
    background: var(--bg);
  }
  .seg button.active {
    background: var(--blue);
    color: #fff;
  }
  .seg button + button {
    border-left: 1px solid var(--border);
  }
  .budget-field {
    flex: 0 0 auto;
    width: 108px;
  }
  .budget-field input {
    width: 100%;
    padding: 7px 10px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    box-sizing: border-box;
  }
  .budget-field input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-shadow);
  }
  .budget-field input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .info-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: 4px;
    color: var(--text-muted);
    cursor: help;
    font-style: normal;
    font-weight: 400;
  }
  .info-icon:hover,
  .info-icon:focus {
    color: var(--blue);
    outline: none;
  }
  .info-pop {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    width: 260px;
    padding: 10px 12px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--card-shadow);
    font-size: 12px;
    font-weight: 400;
    line-height: 1.5;
    text-align: left;
    white-space: normal;
    z-index: 20;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease;
  }
  .info-icon:hover .info-pop,
  .info-icon:focus .info-pop,
  .info-icon:focus-within .info-pop {
    opacity: 1;
    visibility: visible;
  }
  .info-pop strong {
    font-weight: 700;
  }
</style>

<body>
  <div class="page">
  <nav class="nav">
    <div class="nav-brand">
      <a href="/" class="brand-icon" title="Home">RAG ▾</a>
      <div class="brand-dropdown">
        <a href="/chat.html" class="active">Chat</a>
        <a href="/documents.html">Documents</a>
        <a href="/visualize.html">Visualize</a>
      </div>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" title="Toggle dark mode">🌙</button>
  </nav>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <button type="button" id="new-chat-btn">+ New Chat</button>
      <div class="chat-list" id="chat-list"></div>
    </aside>
    <div class="card">
      <h1>Ask your documents</h1>
      <p class="subtitle">Query your RAG-Anything knowledge base.</p>

      <div class="mode-toggle" id="mode-toggle">
        <button type="button" id="chat-mode-btn" data-mode="chat">Chat</button>
        <button type="button" id="query-mode-btn" data-mode="query">Query</button>
      </div>

      <div id="messages"></div>
      <div class="history-actions">
        <button type="button" id="clear-btn" class="clear-btn">Clear history</button>
      </div>

      <form id="query-form">
        <textarea id="query" name="query" placeholder="What would you like to know?" required></textarea>
        <div class="row">
          <div class="think-field">
            <label>Thinking</label>
            <div class="seg" id="think-toggle">
              <button type="button" data-think="off">Off</button>
              <button type="button" data-think="auto">Auto</button>
              <button type="button" data-think="on">On</button>
            </div>
          </div>
          <div class="budget-field">
            <label for="think-budget">Budget<span class="info-icon" tabindex="0" role="note" aria-label="Thinking budget help">ⓘ<span class="info-pop"><strong>Thinking budget</strong> caps the model's hidden reasoning tokens on thinking-on answers. Empty = uncapped (deepest, slowest).<br><br><strong>Recommended 512–1024.</strong> Lower = faster, but may cut off hard multi-hop reasoning.<br><br>Scaling (~57 reasoning tok/s here): 512 ≈ +9 s, 1024 ≈ +18 s, 2048 ≈ +36 s.<br><br>Applies only when Thinking is On, or when Auto escalates. Ignored on non-thinking models.</span></span></label>
            <input type="number" id="think-budget" min="0" step="128" placeholder="uncapped">
          </div>
          <div class="mode-field">
            <label for="mode">Mode</label>
            <select id="mode" name="mode">
              <option value="hybrid" selected>hybrid</option>
              <option value="local">local</option>
              <option value="global">global</option>
              <option value="naive">naive</option>
              <option value="mix">mix</option>
              <option value="bypass">bypass</option>
            </select>
          </div>
          <button type="submit" id="submit-btn">Ask</button>
        </div>
      </form>
    </div>
  </div>
  </div>

  <script src="/theme.js"></script>
  <script>
    const form = document.getElementById("query-form");
    const submitBtn = document.getElementById("submit-btn");
    const messagesEl = document.getElementById("messages");
    const clearBtn = document.getElementById("clear-btn");
    const modeToggle = document.getElementById("mode-toggle");
    const modeButtons = modeToggle.querySelectorAll("button");
    const card = document.querySelector(".card");
    const layout = document.getElementById("layout");
    const chatList = document.getElementById("chat-list");
    const newChatBtn = document.getElementById("new-chat-btn");
    const queryInput = document.getElementById("query");

    // Thinking control (Off | Auto | On) for the synthesis model, sent with each
    // query. Persisted like the theme/mode toggles; defaults to Off (fast).
    const THINKING_KEY = "ragThinking";
    const thinkToggle = document.getElementById("think-toggle");
    let thinkingMode = localStorage.getItem(THINKING_KEY) || "off";

    // Reasoning-token cap for thinking-on answers. Defaults to 1024; blank =
    // uncapped. Disabled (no effect) when Thinking is Off.
    const BUDGET_KEY = "ragThinkingBudget";
    const budgetInput = document.getElementById("think-budget");
    const savedBudget = localStorage.getItem(BUDGET_KEY);
    budgetInput.value = savedBudget !== null ? savedBudget : "1024";
    budgetInput.addEventListener("input", () => {
      localStorage.setItem(BUDGET_KEY, budgetInput.value.trim());
    });

    function applyThinkingMode() {
      for (const btn of thinkToggle.querySelectorAll("button")) {
        btn.classList.toggle("active", btn.dataset.think === thinkingMode);
      }
      // Budget only affects thinking-on passes, so grey it out under Off.
      budgetInput.disabled = thinkingMode === "off";
    }
    thinkToggle.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-think]");
      if (!btn) return;
      thinkingMode = btn.dataset.think;
      localStorage.setItem(THINKING_KEY, thinkingMode);
      applyThinkingMode();
    });
    applyThinkingMode();

    queryInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey) return;
      event.preventDefault();
      if (!submitBtn.disabled) form.requestSubmit();
    });

    const ACTIVE_MODE_KEY = "ragActiveMode";
    const CURRENT_SESSION_KEY = "ragCurrentSessionId";

    function storageKeyForMode(viewMode) {
      return `ragMessages_${viewMode}`;
    }

    function loadMessages(viewMode) {
      try {
        return JSON.parse(sessionStorage.getItem(storageKeyForMode(viewMode))) || [];
      } catch {
        return [];
      }
    }

    function saveMessages(viewMode, turnsToSave) {
      sessionStorage.setItem(storageKeyForMode(viewMode), JSON.stringify(turnsToSave));
    }

    let currentMode = sessionStorage.getItem(ACTIVE_MODE_KEY) || "chat";
    // Cached per mode so a full page reload (e.g. switching to another tab and
    // back) can repaint the conversation instantly. In chat mode the server is
    // still the source of truth -- initChatMode() reconciles against it -- but
    // the cache covers the gap before that round-trip and any turn the server
    // hasn't recorded yet.
    let turns = loadMessages(currentMode);
    let currentSessionId = sessionStorage.getItem(CURRENT_SESSION_KEY) || null;

    // The in-flight /query/stream request, if any. Aborting it stops the client
    // render loop AND signals the server (client disconnect) to stop generating
    // an answer the user has moved on from -- so New Chat, switching/deleting a
    // session, resubmitting, Clear, or navigating away don't leave work running.
    let activeStreamController = null;
    function cancelActiveStream() {
      if (activeStreamController) {
        activeStreamController.abort();
        activeStreamController = null;
      }
    }
    window.addEventListener("pagehide", cancelActiveStream);

    // Chat-mode conversations live server-side (api/session_store.py): the
    // server owns the rolling-history window/summary and naming, and clears
    // all chats when it restarts. The client just tracks which session is
    // active and renders whatever turns/title the server reports for it.
    async function fetchSessions() {
      const response = await fetch("/sessions");
      return response.ok ? response.json() : [];
    }

    async function createSession() {
      const response = await fetch("/sessions", { method: "POST" });
      const data = await response.json();
      return data.session_id;
    }

    async function fetchSessionTurns(sessionId) {
      const response = await fetch(`/sessions/${sessionId}`);
      if (!response.ok) return [];
      const data = await response.json();
      return data.turns
        .map((t) => ({ query: t.query, text: t.answer, kind: "answer" }))
        .reverse();
    }

    function renderChatList(sessions) {
      chatList.innerHTML = "";
      for (const session of sessions) {
        const item = document.createElement("div");
        item.className = "chat-item" + (session.session_id === currentSessionId ? " active" : "");
        item.dataset.sessionId = session.session_id;

        const nameSpan = document.createElement("span");
        nameSpan.className = "chat-item-name";
        nameSpan.textContent = session.title;
        item.appendChild(nameSpan);

        const renameBtn = document.createElement("button");
        renameBtn.type = "button";
        renameBtn.className = "rename-btn";
        renameBtn.textContent = "✎";
        item.appendChild(renameBtn);

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "×";
        item.appendChild(deleteBtn);

        chatList.appendChild(item);
      }
    }

    chatList.addEventListener("click", async (event) => {
      const item = event.target.closest(".chat-item");
      if (!item) return;
      const sessionId = item.dataset.sessionId;

      if (event.target.closest(".rename-btn")) {
        const nameSpan = item.querySelector(".chat-item-name");
        const newName = window.prompt("Rename chat", nameSpan ? nameSpan.textContent : "");
        if (newName === null) return;
        const response = await fetch(`/sessions/${sessionId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: newName.trim() }),
        });
        if (response.ok) renderChatList(await fetchSessions());
        return;
      }

      if (event.target.closest(".delete-btn")) {
        if (!window.confirm("Delete this chat?")) return;
        cancelActiveStream();
        const response = await fetch(`/sessions/${sessionId}`, { method: "DELETE" });
        if (!response.ok) return;
        if (sessionId === currentSessionId) {
          // Switch to another existing chat rather than spawning a replacement.
          // Auto-creating here bumped the never-reused seq counter, leaving
          // later chats confusingly numbered. Only create when none remain.
          const sessions = await fetchSessions();
          if (sessions.length) {
            currentSessionId = sessions[0].session_id; // most recent remaining
            sessionStorage.setItem(CURRENT_SESSION_KEY, currentSessionId);
            renderChatList(sessions);
            turns = await fetchSessionTurns(currentSessionId);
            renderMessages();
          } else {
            currentSessionId = null;
            sessionStorage.removeItem(CURRENT_SESSION_KEY);
            await initChatMode();
          }
        } else {
          renderChatList(await fetchSessions());
        }
        return;
      }

      if (sessionId === currentSessionId) return;
      cancelActiveStream();
      currentSessionId = sessionId;
      sessionStorage.setItem(CURRENT_SESSION_KEY, currentSessionId);
      turns = await fetchSessionTurns(currentSessionId);
      renderMessages();
      for (const el of chatList.querySelectorAll(".chat-item")) {
        el.classList.toggle("active", el.dataset.sessionId === currentSessionId);
      }
    });

    newChatBtn.addEventListener("click", async () => {
      cancelActiveStream();
      currentSessionId = await createSession();
      sessionStorage.setItem(CURRENT_SESSION_KEY, currentSessionId);
      turns = [];
      renderMessages();
      renderChatList(await fetchSessions());
    });

    async function initChatMode() {
      const sessions = await fetchSessions();
      const exists = sessions.some((s) => s.session_id === currentSessionId);
      if (!currentSessionId || !exists) {
        currentSessionId = await createSession();
        sessionStorage.setItem(CURRENT_SESSION_KEY, currentSessionId);
        sessions.unshift({ session_id: currentSessionId, title: "New Chat" });
      }
      renderChatList(sessions);
      turns = await fetchSessionTurns(currentSessionId);
      renderMessages();
    }

    async function setActiveMode(viewMode) {
      currentMode = viewMode;
      sessionStorage.setItem(ACTIVE_MODE_KEY, viewMode);
      card.classList.toggle("query-mode", viewMode === "query");
      layout.classList.toggle("query-mode", viewMode === "query");
      for (const btn of modeButtons) {
        btn.classList.toggle("active", btn.dataset.mode === viewMode);
      }
      if (viewMode === "chat") {
        await initChatMode();
      } else {
        turns = loadMessages(viewMode);
        renderMessages();
      }
    }

    modeToggle.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-mode]");
      if (btn) setActiveMode(btn.dataset.mode);
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderInline(text) {
      return escapeHtml(text).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderMarkdown(markdown) {
      const lines = markdown.split("\n");
      const html = [];
      let listType = null; // "ul" | "ol" | null
      let paragraph = [];

      const flushParagraph = () => {
        if (paragraph.length) {
          html.push(`<p>${paragraph.join(" ")}</p>`);
          paragraph = [];
        }
      };
      const closeList = () => {
        if (listType) {
          html.push(`</${listType}>`);
          listType = null;
        }
      };

      for (const rawLine of lines) {
        const line = rawLine.trim();

        if (!line) {
          flushParagraph();
          closeList();
          continue;
        }

        const headingMatch = line.match(/^(#{1,3})\s+(.*)/);
        if (headingMatch) {
          flushParagraph();
          closeList();
          const level = headingMatch[1].length;
          html.push(`<h${level}>${renderInline(headingMatch[2])}</h${level}>`);
          continue;
        }

        const bulletMatch = line.match(/^[*-]\s+(.*)/);
        const numberedMatch = line.match(/^\d+[.)]\s+(.*)/);
        if (bulletMatch || numberedMatch) {
          flushParagraph();
          const wantedType = bulletMatch ? "ul" : "ol";
          if (listType !== wantedType) {
            closeList();
            html.push(`<${wantedType}>`);
            listType = wantedType;
          }
          html.push(`<li>${renderInline((bulletMatch || numberedMatch)[1])}</li>`);
          continue;
        }

        closeList();
        paragraph.push(renderInline(line));
      }

      flushParagraph();
      closeList();
      return html.join("");
    }

    function scrollMessagesToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderMessages() {
      // Persist on every full render so the conversation survives a page reload.
      // Streaming does NOT go through here (see the submit handler), so this
      // fires only on discrete state changes, not on every chunk.
      saveMessages(currentMode, turns);
      messagesEl.innerHTML = "";
      if (!turns.length) {
        const emptyState = document.createElement("p");
        emptyState.className = "empty-state";
        emptyState.textContent =
          currentMode === "query"
            ? "No query yet — ask a question to get started."
            : "No messages yet — ask a question to get started.";
        messagesEl.appendChild(emptyState);
        return;
      }
      for (const turn of [...turns].reverse()) {
        const userBubble = document.createElement("div");
        userBubble.className = "bubble user";
        userBubble.textContent = turn.query;
        messagesEl.appendChild(userBubble);

        const assistantBubble = document.createElement("div");
        assistantBubble.className = `bubble assistant ${turn.kind}`;
        if (turn.kind === "answer") {
          assistantBubble.innerHTML = renderMarkdown(turn.text);
        } else {
          assistantBubble.textContent = turn.text;
        }
        messagesEl.appendChild(assistantBubble);
      }
      scrollMessagesToBottom();
    }

    card.classList.toggle("query-mode", currentMode === "query");
    layout.classList.toggle("query-mode", currentMode === "query");
    for (const btn of modeButtons) {
      btn.classList.toggle("active", btn.dataset.mode === currentMode);
    }
    // Paint any cached turns immediately; in chat mode initChatMode() then
    // reconciles against the server (the source of truth).
    renderMessages();
    if (currentMode === "chat") {
      initChatMode();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const query = document.getElementById("query").value.trim();
      const mode = document.getElementById("mode").value;
      if (!query) return;
      queryInput.value = "";

      // A new submit supersedes any stream still running from a previous one.
      cancelActiveStream();
      const controller = new AbortController();
      activeStreamController = controller;

      submitBtn.disabled = true;
      const turn = { query, kind: "loading", text: "Thinking…" };
      if (currentMode === "query") {
        turns = [turn];
      } else {
        turns.unshift(turn);
      }
      renderMessages();

      // The newest turn renders last, so its assistant bubble is the final one
      // in the list. During streaming we update ONLY this element rather than
      // rebuilding the whole message list (which re-parses every turn's markdown)
      // on every chunk -- that per-chunk full rebuild was the source of the lag.
      const streamingBubble = messagesEl.querySelector(
        ".bubble.assistant:last-child"
      );
      let rafId = null;
      const paintStreamingBubble = () => {
        rafId = null;
        if (!streamingBubble) return;
        if (turn.kind === "answer") {
          streamingBubble.className = "bubble assistant answer";
          streamingBubble.innerHTML = renderMarkdown(turn.text);
        } else {
          // Loading / auto-escalation delay notice: plain text, muted style.
          streamingBubble.className = "bubble assistant loading";
          streamingBubble.textContent = turn.text;
        }
        scrollMessagesToBottom();
      };
      // Coalesce bursts of chunks into at most one re-parse per animation frame.
      const scheduleStreamingRender = () => {
        if (rafId === null) rafId = requestAnimationFrame(paintStreamingBubble);
      };

      try {
        const budgetVal = parseInt(budgetInput.value, 10);
        const thinking_budget =
          Number.isFinite(budgetVal) && budgetVal > 0 ? budgetVal : null;
        const requestBody =
          currentMode === "chat"
            ? { query, mode, thinking: thinkingMode, thinking_budget, session_id: currentSessionId }
            : { query, mode, thinking: thinkingMode, thinking_budget, conversation_history: [] };
        const response = await fetch("/query/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody),
          signal: controller.signal,
        });

        if (!response.ok) {
          // Errors raised before streaming starts (e.g. init failures) come
          // back as a normal JSON error body, same shape as /query's.
          let detail = `Request failed (${response.status})`;
          try {
            const data = await response.json();
            detail = data.detail || detail;
          } catch (_) {
            // Body wasn't JSON -- keep the generic message.
          }
          throw new Error(detail);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        // Auto mode may send an out-of-band status notice (delay warning)
        // wrapped in \x1e … \x1e control frames. `raw` buffers undecoded bytes
        // so a frame split across chunks is handled; `accumulated` is the
        // frame-stripped answer text; `statusMsg` is the latest notice.
        const STATUS_SENTINEL = "\u001e";
        let raw = "";
        let accumulated = "";
        let statusMsg = null;

        const extractFrames = () => {
          while (true) {
            const start = raw.indexOf(STATUS_SENTINEL);
            if (start === -1) {
              accumulated += raw;
              raw = "";
              return;
            }
            accumulated += raw.slice(0, start);
            const end = raw.indexOf(STATUS_SENTINEL, start + 1);
            if (end === -1) {
              // Incomplete frame: keep it (from the opening sentinel) buffered.
              raw = raw.slice(start);
              return;
            }
            try {
              const msg = JSON.parse(raw.slice(start + 1, end));
              if (msg && msg.type === "status") statusMsg = msg.message;
            } catch (_) {
              // Malformed frame -- ignore it rather than dumping it as text.
            }
            raw = raw.slice(end + 1);
          }
        };

        const applyStreamState = () => {
          if (accumulated) {
            turn.kind = "answer";
            turn.text = accumulated;
          } else if (statusMsg) {
            turn.kind = "loading";
            turn.text = statusMsg;
          }
          scheduleStreamingRender();
        };

        let streamDone = false;
        while (!streamDone) {
          const { done, value } = await reader.read();
          streamDone = done;
          if (value) {
            raw += decoder.decode(value, { stream: true });
            extractFrames();
            applyStreamState();
          }
        }
        raw += decoder.decode();
        extractFrames();
        if (accumulated) {
          turn.kind = "answer";
          turn.text = accumulated;
        }
        if (rafId !== null) cancelAnimationFrame(rafId);
        renderMessages();
      } catch (err) {
        if (rafId !== null) cancelAnimationFrame(rafId);
        // An abort is a user action (New Chat, switch, resubmit, navigate away),
        // not an error -- leave the DOM/turns to whatever superseded this stream.
        if (err.name === "AbortError") return;
        turn.kind = "error";
        turn.text = err.message || "Something went wrong.";
        renderMessages();
      } finally {
        if (activeStreamController === controller) activeStreamController = null;
        submitBtn.disabled = false;
      }
    });

    clearBtn.addEventListener("click", () => {
      cancelActiveStream();
      turns = [];
      sessionStorage.removeItem(storageKeyForMode(currentMode));
      renderMessages();
    });
  </script>
</body>
</html>
