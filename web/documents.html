<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG-Anything Documents</title>
<script>
  (function () {
    const saved = localStorage.getItem("ragTheme");
    const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<link rel="icon" href="data:,">
<style>
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .dropzone:hover,
  .dropzone.dragover {
    border-color: var(--blue);
    background: var(--accent-soft-bg);
    color: var(--blue-dark);
  }
  .dropzone strong {
    color: inherit;
  }
  .dropzone-icon {
    font-size: 28px;
    color: var(--text-faint);
    margin-bottom: 6px;
    transition: color 0.15s ease;
    line-height: 1;
  }
  .dropzone:hover .dropzone-icon,
  .dropzone.dragover .dropzone-icon {
    color: var(--blue);
  }
  .dropzone p {
    margin: 0;
    font-size: 14px;
  }
  .dropzone-hint {
    font-size: 12px !important;
    color: var(--text-faint);
  }
  input[type="file"] {
    display: none;
  }
  .progress-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .progress-item {
    border: 1px solid var(--accent-light);
    border-radius: 8px;
    padding: 16px;
    background: var(--surface-subtle);
  }
  .progress-item .progress-filename {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 8px;
    word-break: break-word;
  }
  .progress-item progress {
    width: 100%;
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
    border: none;
  }
  .progress-item progress::-webkit-progress-bar {
    background: var(--accent-light);
    border-radius: 999px;
  }
  .progress-item progress::-webkit-progress-value {
    background: var(--blue);
    border-radius: 999px;
  }
  .progress-item progress::-moz-progress-bar {
    background: var(--blue);
    border-radius: 999px;
  }
  .progress-item .progress-meta {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .progress-item .progress-stage {
    font-weight: 600;
    color: var(--accent-text-strong);
    text-transform: capitalize;
  }
  .progress-item .progress-message {
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .upload-status {
    margin: 10px 0 0;
    font-size: 13px;
    color: var(--blue);
    min-height: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 24px;
    font-size: 14px;
  }
  th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: middle;
    color: var(--text);
  }
  td.filename {
    word-break: break-word;
  }
  td.error-text {
    font-size: 12px;
    color: var(--danger-text);
    margin-top: 2px;
    display: block;
  }
  tbody tr:hover td {
    background: var(--surface-subtle);
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge.processing {
    background: var(--accent-light);
    color: var(--accent-text-strong);
  }
  .badge.completed {
    background: var(--success-bg-strong);
    color: var(--success-text-strong);
  }
  .badge.failed {
    background: var(--danger-bg-strong);
    color: var(--danger-text);
  }
  .badge.pending {
    background: var(--neutral-bg);
    color: var(--text-secondary);
  }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-faint);
    font-size: 16px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover {
    background: var(--danger-bg-strong);
    color: var(--danger-text);
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    max-width: 320px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: var(--card-shadow);
    z-index: 100;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  .toast.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .toast.error {
    background: var(--danger-bg-strong);
    color: var(--danger-text);
    border: 1px solid var(--danger-border);
  }
  .containers-panel {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 0 0 16px;
  }
  .containers-panel-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-faint);
  }
  .upload-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 16px;
  }
  .upload-row-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .member-cell {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .member-cell .container-chip {
    padding: 3px 10px;
    font-size: 11px;
  }
  .member-cell .mini-select {
    padding: 3px 6px;
  }
  .member-none {
    color: var(--text-faint);
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="page">
  <nav class="nav">
    <div class="nav-brand">
      <a href="/" class="brand-icon" title="Home">RAG ▾</a>
      <div class="brand-dropdown">
        <a href="/chat.html">Chat</a>
        <a href="/documents.html" class="active">Documents</a>
        <a href="/visualize.html">Visualize</a>
      </div>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" title="Toggle dark mode">🌙</button>
  </nav>
  <div class="card">
    <h1>Manage documents</h1>
    <p class="subtitle">Upload files into your RAG-Anything knowledge base.</p>

    <div class="containers-panel" id="containers-panel">
      <span class="containers-panel-label">Containers</span>
      <div class="container-filter" id="containers-list"></div>
    </div>

    <div class="upload-row">
      <span class="upload-row-label">Upload into</span>
      <select class="mini-select" id="upload-container">
        <option value="">All documents</option>
      </select>
    </div>

    <div class="dropzone" id="dropzone">
      <span class="dropzone-icon">↑</span>
      <p><strong>Click to browse</strong> or drag and drop files here</p>
      <p class="dropzone-hint">PDF, DOCX, TXT and more</p>
    </div>
    <div class="progress-panel" id="progress-panel" style="display: none;"></div>
    <input type="file" id="file-input" multiple>
    <p class="upload-status" id="upload-status"></p>

    <table id="doc-table">
      <thead>
        <tr>
          <th>File</th>
          <th>Status</th>
          <th>Uploaded</th>
          <th>Containers</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="doc-table-body"></tbody>
    </table>
    <p class="empty-state" id="empty-state">No documents yet — upload one to get started.</p>
  </div>
  <div class="toast" id="toast"></div>
  </div>

  <script src="/theme.js"></script>
  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    const tableEl = document.getElementById("doc-table");
    const tableBody = document.getElementById("doc-table-body");
    const emptyState = document.getElementById("empty-state");
    const uploadStatus = document.getElementById("upload-status");
    const progressPanel = document.getElementById("progress-panel");
    const toastEl = document.getElementById("toast");
    let toastTimer = null;

    const containersPanel = document.getElementById("containers-panel");
    const containersList = document.getElementById("containers-list");
    const uploadContainerSelect = document.getElementById("upload-container");

    // Containers ("custom databases") + a by-id lookup. Populated from
    // GET /containers; drives the management panel, the upload picker, and each
    // row's membership chips. Empty until loadContainers() runs.
    let containers = [];
    let containersById = {};

    function showToast(message, type = "error") {
      toastEl.textContent = message;
      toastEl.className = `toast visible ${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("visible");
      }, 4000);
    }

    // task_id -> DocumentTask, mirrors the server's task list exactly.
    const taskCache = new Map();
    let pollHandle = null;

    // --- Progress bar creep --------------------------------------------------
    // The backend emits one monotonic overall % across the whole pipeline, but
    // the dominant text_insert (LLM extraction) phase has no intra-progress
    // events, so between real milestones the bar would sit still. We fill those
    // gaps client-side: each stage owns a [start,end] band and a rough duration
    // estimate; the bar creeps linearly from start toward end over that estimate
    // and simply parks at `end` if the stage runs long (that's fine) until the
    // next real milestone snaps it forward. Bands mirror ProgressTrackingCallback.
    const STAGE_BANDS = {
      queued:      { start: 0,   end: 3,   estMs: 2000 },
      parsing:     { start: 3,   end: 20,  estMs: 20000 },
      text_insert: { start: 22,  end: 65,  estMs: 60000 },
      multimodal:  { start: 67,  end: 97,  estMs: 30000 },
      complete:    { start: 100, end: 100, estMs: 1 },
      failed:      { start: 0,   end: 0,   estMs: 1 },
    };
    const stageBand = (stage) => STAGE_BANDS[stage] || STAGE_BANDS.queued;

    // task_id -> { displayed, stage, stageEnteredAt }
    const creepState = new Map();
    let creepHandle = null;

    // Fold the latest server snapshot into a task's creep state (monotonic).
    function syncCreep(task) {
      const now = Date.now();
      let st = creepState.get(task.task_id);
      if (!st) {
        st = { displayed: 0, stage: null, stageEnteredAt: now };
        creepState.set(task.task_id, st);
      }
      const stage = task.stage || "queued";
      if (stage !== st.stage) {
        st.stage = stage;
        st.stageEnteredAt = now; // restart the clock for the new band
      }
      const server = task.progress == null ? 0 : task.progress;
      if (server > st.displayed) st.displayed = server; // absorb real milestone
      if (task.status === "completed") st.displayed = 100;
      return st;
    }

    // Advance each active bar toward its band end and paint it, without a full
    // re-render (keeps motion smooth between the 1s polls).
    function creepTick() {
      const active = findActiveTasks();
      if (!active.length) {
        stopCreep();
        return;
      }
      const activeIds = new Set(active.map((t) => t.task_id));
      for (const id of creepState.keys()) {
        if (!activeIds.has(id)) creepState.delete(id); // prune finished tasks
      }
      const now = Date.now();
      for (const task of active) {
        const st = creepState.get(task.task_id);
        if (!st) continue;
        const band = stageBand(st.stage);
        const frac = Math.min(1, (now - st.stageEnteredAt) / band.estMs);
        const target = band.start + frac * (band.end - band.start);
        if (target > st.displayed) st.displayed = target;
        const el = progressPanel.querySelector(
          `progress[data-task-id="${task.task_id}"]`
        );
        if (el) el.value = st.displayed;
      }
    }

    function ensureCreep() {
      if (!creepHandle) creepHandle = setInterval(creepTick, 200);
    }
    function stopCreep() {
      if (creepHandle) {
        clearInterval(creepHandle);
        creepHandle = null;
      }
    }

    // Uploads can briefly appear as two task entries: the live upload task
    // (plain UUID task_id) and a synthesized snapshot the server re-derives
    // from on-disk doc status (task_id is the content-hash doc_id, always
    // prefixed "doc-"). Collapse the pair to the live entry, since it tracks
    // real-time backend state (including the timeout fail-safe) instead of
    // a polled disk snapshot that can lag behind.
    const UPLOAD_PREFIX_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}_/i;

    function normalizedName(fileName) {
      return (fileName || "").replace(UPLOAD_PREFIX_RE, "");
    }

    function isSynthesized(task) {
      return task.task_id.startsWith("doc-");
    }

    function dedupeTasks(tasks) {
      const liveTasks = tasks.filter((t) => !isSynthesized(t));
      const hiddenIds = new Set();

      for (const synth of tasks) {
        if (!isSynthesized(synth)) continue;

        const match = liveTasks.find((live) => {
          if (live.doc_id) return live.doc_id === synth.task_id;
          // Live task hasn't linked its doc_id yet (still processing) --
          // fall back to matching the upload-prefixed filename and recency.
          const sameName = normalizedName(live.file_name) === normalizedName(synth.file_name);
          const closeInTime =
            Math.abs(new Date(live.created_at) - new Date(synth.created_at)) < 5 * 60 * 1000;
          return sameName && closeInTime;
        });

        if (match) hiddenIds.add(synth.task_id);
      }

      return tasks.filter((t) => !hiddenIds.has(t.task_id));
    }

    function formatDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString();
    }

    function findActiveTasks() {
      return dedupeTasks([...taskCache.values()])
        .filter((t) => t.status === "processing" || t.status === "pending")
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    }

    function renderActivePanel() {
      const active = findActiveTasks();
      if (!active.length) {
        dropzone.style.display = "";
        progressPanel.style.display = "none";
        stopCreep();
        return;
      }

      dropzone.style.display = "none";
      progressPanel.style.display = "block";
      progressPanel.innerHTML = active
        .map((task) => {
          // Always render a numeric value (from the monotonic creep state) so an
          // active bar never falls back to the browser's indeterminate animation.
          // Use the RAW displayed value (no rounding) so this 1s re-render and the
          // 200ms creep tick (which sets el.value = st.displayed) always agree --
          // rounding here would round up past the raw creep value and cause a
          // per-second backward "snap-back" just before each band boundary.
          const st = syncCreep(task);
          const value = st.displayed;
          return `
            <div class="progress-item">
              <p class="progress-filename">${escapeHtml(task.file_name)}</p>
              <progress max="100" value="${value}" data-task-id="${escapeHtml(task.task_id)}"></progress>
              <p class="progress-meta">
                <span class="progress-stage">${escapeHtml(task.stage || "queued")}</span>
                <span class="progress-message">${escapeHtml(task.progress_message || "")}</span>
              </p>
            </div>
          `;
        })
        .join("");
      ensureCreep();
    }

    function render() {
      const tasks = dedupeTasks([...taskCache.values()]).sort(
        (a, b) => new Date(b.created_at) - new Date(a.created_at)
      );

      renderActivePanel();
      tableEl.style.display = tasks.length ? "table" : "none";
      emptyState.style.display = tasks.length ? "none" : "block";

      tableBody.innerHTML = tasks
        .map((task) => {
          const deleteBtn = `<button class="icon-btn" data-delete="${task.task_id}" title="Delete">&times;</button>`;
          const errorLine = task.error
            ? `<span class="error-text">${escapeHtml(task.error)}</span>`
            : "";
          return `
            <tr>
              <td class="filename">${escapeHtml(task.file_name)}${errorLine}</td>
              <td><span class="badge ${task.status}">${task.status}</span></td>
              <td>${formatDate(task.created_at)}</td>
              <td><div class="member-cell">${memberCell(task)}</div></td>
              <td>${deleteBtn}</td>
            </tr>
          `;
        })
        .join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // --- Containers ("custom databases") -------------------------------------
    function containerName(cid) {
      return (containersById[cid] && containersById[cid].name) || cid;
    }

    async function loadContainers() {
      try {
        const response = await fetch("/containers");
        if (response.ok) containers = await response.json();
      } catch (err) {
        /* offline / none -- fall back to no containers (the virtual "All") */
      }
      containersById = {};
      for (const c of containers) containersById[c.id] = c;
      renderContainersPanel();
      renderUploadPicker();
    }

    // Refetch containers + documents, then repaint. Called after any container or
    // membership mutation, since the doc list's polling stops once nothing is
    // processing and wouldn't otherwise reflect the change.
    async function reload() {
      await loadContainers();
      await refreshList();
    }

    function renderContainersPanel() {
      const chips = containers
        .map((c) => {
          const count = (c.member_doc_ids || []).length;
          return `<span class="container-chip is-static" title="${escapeHtml(c.name)}">${escapeHtml(c.name)}<span class="chip-count">${count}</span><button class="chip-action" data-rename-container="${escapeHtml(c.id)}" title="Rename">✎</button><button class="chip-remove" data-delete-container="${escapeHtml(c.id)}" title="Delete container">&times;</button></span>`;
        })
        .join("");
      containersList.innerHTML =
        chips +
        `<button type="button" class="container-chip chip-add" data-new-container>+ New</button>`;
    }

    function renderUploadPicker() {
      const current = uploadContainerSelect.value;
      uploadContainerSelect.innerHTML =
        `<option value="">All documents</option>` +
        containers
          .map((c) => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`)
          .join("");
      if (current && containers.some((c) => c.id === current)) {
        uploadContainerSelect.value = current; // preserve a still-valid choice
      }
    }

    // A document's membership cell: a chip per container (with × to remove once
    // the doc is completed and thus has a doc_id), plus an "Add…" picker of the
    // containers it isn't in yet. Read-only while still processing (no doc_id).
    function memberCell(task) {
      const ids = task.container_ids || [];
      const editable = Boolean(task.doc_id);
      const chips = ids.map((cid) => {
        const remove = editable
          ? `<button class="chip-remove" data-remove data-cid="${escapeHtml(cid)}" data-doc-id="${escapeHtml(task.doc_id)}" title="Remove from ${escapeHtml(containerName(cid))}">&times;</button>`
          : "";
        return `<span class="container-chip is-static">${escapeHtml(containerName(cid))}${remove}</span>`;
      });
      let add = "";
      if (editable) {
        const available = containers.filter((c) => !ids.includes(c.id));
        if (available.length) {
          const opts = available
            .map((c) => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`)
            .join("");
          add = `<select class="mini-select" data-add-doc-id="${escapeHtml(task.doc_id)}"><option value="">+ Add…</option>${opts}</select>`;
        }
      }
      return chips.join("") + add || `<span class="member-none">—</span>`;
    }

    function hasInFlightTasks() {
      return [...taskCache.values()].some((t) => t.status === "processing" || t.status === "pending");
    }

    function ensurePolling() {
      if (pollHandle || !hasInFlightTasks()) return;
      pollHandle = setInterval(async () => {
        await refreshList();
        if (!hasInFlightTasks()) {
          clearInterval(pollHandle);
          pollHandle = null;
        }
      }, 1000);
    }

    async function refreshList() {
      const response = await fetch("/documents");
      if (!response.ok) return;
      const tasks = await response.json();

      taskCache.clear();
      for (const task of tasks) {
        taskCache.set(task.task_id, task);
      }

      render();
    }

    async function uploadFile(file, containerId) {
      const formData = new FormData();
      formData.append("file", file);
      if (containerId) formData.append("container_id", containerId);

      uploadStatus.textContent = `Uploading ${file.name}…`;

      const response = await fetch("/documents", {
        method: "POST",
        body: formData,
      });

      if (response.ok) {
        const task = await response.json();
        taskCache.set(task.task_id, task);
        render();
        ensurePolling();
      } else {
        const data = await response.json().catch(() => ({}));
        showToast(`Failed to upload ${file.name}: ${data.detail || response.status}`);
      }
    }

    async function handleFiles(fileList) {
      if (!fileList.length) return;
      // One container choice applies to the whole batch (read once up front).
      const containerId = uploadContainerSelect.value;
      try {
        await Promise.all([...fileList].map((file) => uploadFile(file, containerId)));
      } finally {
        uploadStatus.textContent = "";
      }
    }

    dropzone.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (event) => {
      handleFiles(event.target.files);
      fileInput.value = "";
    });

    ["dragenter", "dragover"].forEach((evt) =>
      dropzone.addEventListener(evt, (event) => {
        event.preventDefault();
        dropzone.classList.add("dragover");
      })
    );
    ["dragleave", "drop"].forEach((evt) =>
      dropzone.addEventListener(evt, (event) => {
        event.preventDefault();
        dropzone.classList.remove("dragover");
      })
    );
    dropzone.addEventListener("drop", (event) => {
      handleFiles(event.dataTransfer.files);
    });

    tableBody.addEventListener("click", async (event) => {
      // "Remove from this container" (non-destructive) -- the chip's × button.
      const removeBtn = event.target.closest("[data-remove]");
      if (removeBtn) {
        const cid = removeBtn.getAttribute("data-cid");
        const docId = removeBtn.getAttribute("data-doc-id");
        const response = await fetch(`/containers/${cid}/documents/${docId}`, {
          method: "DELETE",
        });
        if (response.ok || response.status === 404) {
          await reload();
        } else {
          const data = await response.json().catch(() => ({}));
          showToast(`Failed to remove from container: ${data.detail || response.status}`);
        }
        return;
      }

      // "Delete from the entire database" (destructive) -- the row's × button.
      const deleteBtn = event.target.closest("[data-delete]");
      if (!deleteBtn) return;
      const deleteId = deleteBtn.getAttribute("data-delete");
      if (
        !confirm(
          "Delete this document from the entire database? It will be removed from every container. This cannot be undone."
        )
      )
        return;
      const response = await fetch(`/documents/${deleteId}`, { method: "DELETE" });
      if (response.ok || response.status === 404) {
        taskCache.delete(deleteId);
        render();
        loadContainers(); // member counts changed server-side (doc forgotten)
      } else {
        const data = await response.json().catch(() => ({}));
        showToast(`Failed to delete document: ${data.detail || response.status}`);
      }
    });

    // Per-row "Add to container" picker (the change event bubbles from <select>).
    tableBody.addEventListener("change", async (event) => {
      const select = event.target.closest("select[data-add-doc-id]");
      if (!select) return;
      const cid = select.value;
      const docId = select.getAttribute("data-add-doc-id");
      if (!cid) return;
      const response = await fetch(`/containers/${cid}/documents`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ doc_id: docId }),
      });
      if (response.ok) {
        await reload();
      } else {
        const data = await response.json().catch(() => ({}));
        showToast(`Failed to add to container: ${data.detail || response.status}`);
        select.value = "";
      }
    });

    // Containers panel: create / rename / delete (native prompt/confirm).
    containersPanel.addEventListener("click", async (event) => {
      if (event.target.closest("[data-new-container]")) {
        const name = (window.prompt("New container name") || "").trim();
        if (!name) return;
        const response = await fetch("/containers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name }),
        });
        if (response.ok) await reload();
        else showToast("Failed to create container");
        return;
      }

      const renameBtn = event.target.closest("[data-rename-container]");
      if (renameBtn) {
        const cid = renameBtn.getAttribute("data-rename-container");
        const current = containerName(cid);
        const name = window.prompt("Rename container", current);
        if (name === null) return;
        const trimmed = name.trim();
        if (!trimmed || trimmed === current) return;
        const response = await fetch(`/containers/${cid}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: trimmed }),
        });
        if (response.ok) await reload();
        else showToast("Failed to rename container");
        return;
      }

      const deleteBtn = event.target.closest("[data-delete-container]");
      if (deleteBtn) {
        const cid = deleteBtn.getAttribute("data-delete-container");
        if (
          !window.confirm(
            `Delete container "${containerName(cid)}"? Documents are not deleted — they just leave this container.`
          )
        )
          return;
        const response = await fetch(`/containers/${cid}`, { method: "DELETE" });
        if (response.ok || response.status === 404) await reload();
        else showToast("Failed to delete container");
        return;
      }
    });

    reload();
  </script>
</body>
</html>
