<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG-Anything Documents</title>
<link rel="stylesheet" href="/shared.css">
<style>
  .dropzone {
    border: 2px dashed #d1d5db;
    border-radius: 8px;
    padding: 28px 16px;
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone:hover,
  .dropzone.dragover {
    border-color: #2563eb;
    background: #eff6ff;
    color: #1d4ed8;
  }
  .dropzone strong {
    color: inherit;
  }
  .dropzone.disabled {
    pointer-events: none;
    opacity: 0.6;
  }
  input[type="file"] {
    display: none;
  }
  .upload-status {
    margin: 10px 0 0;
    font-size: 13px;
    color: #2563eb;
    min-height: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 24px;
    font-size: 14px;
  }
  th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0 8px 8px;
    border-bottom: 1px solid #e5e7eb;
  }
  td {
    padding: 10px 8px;
    border-bottom: 1px solid #f3f4f6;
    vertical-align: middle;
    color: #1a1a1a;
  }
  td.filename {
    word-break: break-word;
  }
  td.error-text {
    font-size: 12px;
    color: #991b1b;
    margin-top: 2px;
    display: block;
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.processing {
    background: #dbeafe;
    color: #1e40af;
  }
  .badge.completed {
    background: #dcfce7;
    color: #166534;
  }
  .badge.failed {
    background: #fee2e2;
    color: #991b1b;
  }
  .badge.pending {
    background: #f3f4f6;
    color: #4b5563;
  }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #9ca3af;
    font-size: 16px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover {
    background: #fee2e2;
    color: #991b1b;
  }
</style>
</head>
<body>
  <div class="page">
  <nav class="nav">
    <a href="/documents.html" class="active">Documents</a>
    <a href="/">Chat</a>
  </nav>
  <div class="card">
    <h1>Manage documents</h1>
    <p class="subtitle">Upload files into your RAG-Anything knowledge base.</p>

    <div class="dropzone" id="dropzone">
      <strong>Click to browse</strong> or drag and drop files here
    </div>
    <input type="file" id="file-input" multiple>
    <p class="upload-status" id="upload-status"></p>

    <table id="doc-table">
      <thead>
        <tr>
          <th>File</th>
          <th>Status</th>
          <th>Uploaded</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="doc-table-body"></tbody>
    </table>
    <p class="empty-state" id="empty-state">No documents yet — upload one to get started.</p>
  </div>
  </div>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    const tableEl = document.getElementById("doc-table");
    const tableBody = document.getElementById("doc-table-body");
    const emptyState = document.getElementById("empty-state");
    const uploadStatus = document.getElementById("upload-status");

    // task_id -> DocumentTask, mirrors the server's task list exactly.
    const taskCache = new Map();
    let pollHandle = null;

    function formatDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString();
    }

    function render() {
      const tasks = [...taskCache.values()].sort(
        (a, b) => new Date(b.created_at) - new Date(a.created_at)
      );

      tableEl.style.display = tasks.length ? "table" : "none";
      emptyState.style.display = tasks.length ? "none" : "block";

      tableBody.innerHTML = tasks
        .map((task) => {
          const deleteBtn = `<button class="icon-btn" data-delete="${task.task_id}" title="Delete">&times;</button>`;
          const errorLine = task.error
            ? `<span class="error-text">${escapeHtml(task.error)}</span>`
            : "";
          return `
            <tr>
              <td class="filename">${escapeHtml(task.file_name)}${errorLine}</td>
              <td><span class="badge ${task.status}">${task.status}</span></td>
              <td>${formatDate(task.created_at)}</td>
              <td>${deleteBtn}</td>
            </tr>
          `;
        })
        .join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function hasInFlightTasks() {
      return [...taskCache.values()].some((t) => t.status === "processing" || t.status === "pending");
    }

    function ensurePolling() {
      if (pollHandle || !hasInFlightTasks()) return;
      pollHandle = setInterval(async () => {
        await refreshList();
        if (!hasInFlightTasks()) {
          clearInterval(pollHandle);
          pollHandle = null;
        }
      }, 3000);
    }

    async function refreshList() {
      const response = await fetch("/documents");
      if (!response.ok) return;
      const tasks = await response.json();

      taskCache.clear();
      for (const task of tasks) {
        taskCache.set(task.task_id, task);
      }

      render();
    }

    async function uploadFile(file) {
      const formData = new FormData();
      formData.append("file", file);

      uploadStatus.textContent = `Uploading ${file.name}…`;

      const response = await fetch("/documents", {
        method: "POST",
        body: formData,
      });

      if (response.ok) {
        const task = await response.json();
        taskCache.set(task.task_id, task);
        render();
        ensurePolling();
      } else {
        const data = await response.json().catch(() => ({}));
        alert(`Failed to upload ${file.name}: ${data.detail || response.status}`);
      }
    }

    async function handleFiles(fileList) {
      if (!fileList.length) return;
      dropzone.classList.add("disabled");
      try {
        for (const file of fileList) {
          await uploadFile(file);
        }
      } finally {
        uploadStatus.textContent = "";
        dropzone.classList.remove("disabled");
      }
    }

    dropzone.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (event) => {
      handleFiles(event.target.files);
      fileInput.value = "";
    });

    ["dragenter", "dragover"].forEach((evt) =>
      dropzone.addEventListener(evt, (event) => {
        event.preventDefault();
        dropzone.classList.add("dragover");
      })
    );
    ["dragleave", "drop"].forEach((evt) =>
      dropzone.addEventListener(evt, (event) => {
        event.preventDefault();
        dropzone.classList.remove("dragover");
      })
    );
    dropzone.addEventListener("drop", (event) => {
      handleFiles(event.dataTransfer.files);
    });

    tableBody.addEventListener("click", async (event) => {
      const deleteId = event.target.getAttribute("data-delete");
      if (!deleteId) return;

      if (!confirm("Delete this document?")) return;
      const response = await fetch(`/documents/${deleteId}`, { method: "DELETE" });
      if (response.ok || response.status === 404) {
        taskCache.delete(deleteId);
        render();
      } else {
        const data = await response.json().catch(() => ({}));
        alert(`Failed to delete document: ${data.detail || response.status}`);
      }
    });

    refreshList();
  </script>
</body>
</html>
