<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG-Anything Visualize</title>
<script>
  (function () {
    const saved = localStorage.getItem("ragTheme");
    const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .graph-container {
    position: relative;
    width: 100%;
    height: 70vh;
    min-height: 480px;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    background: var(--surface-subtle);
    overflow: hidden;
  }
  .connection-popover {
    position: absolute;
    max-width: 320px;
    max-height: 320px;
    overflow-y: auto;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    box-shadow: var(--card-shadow);
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    z-index: 20;
  }
  .connection-popover-section-title {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-faint);
    margin: 10px 0 4px;
  }
  .connection-popover-topic {
    margin: 0 0 6px;
  }
  .connection-popover-topic-name {
    font-weight: 600;
    color: var(--text);
  }
  .connection-popover-topic-type {
    color: var(--text-faint);
    font-weight: 400;
  }
  .connection-popover-topic-desc,
  .connection-popover-relation-desc {
    color: var(--text-muted);
    display: block;
  }
  .connection-popover-relation {
    margin: 0 0 6px;
  }
  .connection-popover-relation-pair {
    font-weight: 600;
    color: var(--text);
  }
  .connection-popover-close {
    position: absolute;
    top: 4px;
    right: 6px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-faint);
    padding: 2px 4px;
    line-height: 1;
  }
  .connection-popover-close:hover {
    color: var(--text);
  }
  .connection-popover-title {
    font-weight: 600;
    color: var(--text);
    margin: 0 16px 4px 0;
  }
  .connection-popover-score {
    color: var(--blue-dark);
    font-weight: 600;
    margin: 0 0 6px;
  }
  .connection-popover-topics {
    color: var(--text-muted);
    margin: 0;
  }
  .connection-popover-edit {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 8px;
  }
  .connection-popover-edit .connection-popover-score {
    margin: 0;
    white-space: nowrap;
  }
  .connection-popover-slider {
    flex: 1 1 auto;
    min-width: 90px;
    accent-color: var(--blue);
    cursor: pointer;
  }
  .connection-popover-number {
    flex: 0 0 auto;
    width: 3.5em;
    padding: 2px 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    text-align: right;
  }
  #graph-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .graph-legend {
    position: absolute;
    bottom: 10px;
    left: 10px;
    padding: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    font-size: 11px;
    line-height: 1.6;
    color: var(--text-muted);
    pointer-events: none;
    z-index: 5;
  }
  .graph-legend-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .graph-legend-circle {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--blue);
    flex: 0 0 auto;
  }
  .graph-legend-line {
    display: inline-block;
    width: 16px;
    height: 3px;
    border-radius: 2px;
    background: var(--text-secondary);
    flex: 0 0 auto;
  }
  .graph-controls {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 8px;
    z-index: 5;
  }
  .graph-reset-btn {
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-strong);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .graph-reset-btn:hover {
    background: var(--bg);
  }
  .connection-popover-apply {
    padding: 3px 10px;
    background: var(--blue);
    border: 1px solid var(--blue);
    border-radius: 6px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }
  .connection-popover-apply:hover {
    opacity: 0.9;
  }
  .connection-popover-apply.applied {
    background: var(--surface);
    color: var(--blue-dark);
    cursor: default;
  }
  .graph-node-circle {
    fill: var(--blue);
    stroke: var(--surface);
    stroke-width: 2px;
    cursor: grab;
  }
  .graph-node-circle:active {
    cursor: grabbing;
  }
  .graph-link {
    stroke: var(--text-secondary);
    stroke-linecap: round;
    fill: none;
    transition: opacity 0.15s ease;
  }
  .graph-link.dimmed {
    opacity: 0.55;
  }
  .graph-link-hit {
    stroke: transparent;
    stroke-width: 14px;
    cursor: pointer;
  }
  .node {
    transition: opacity 0.15s ease;
  }
  .node.dimmed {
    opacity: 0.55;
  }
  .graph-node-label {
    fill: var(--text-muted);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    pointer-events: none;
    user-select: none;
    paint-order: stroke;
    stroke: var(--surface-subtle);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
  <div class="page">
  <nav class="nav">
    <div class="nav-brand">
      <a href="/" class="brand-icon" title="Home">RAG ▾</a>
      <div class="brand-dropdown">
        <a href="/chat.html">Chat</a>
        <a href="/documents.html">Documents</a>
        <a href="/visualize.html" class="active">Visualize</a>
      </div>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" title="Toggle dark mode">🌙</button>
  </nav>
  <div class="card">
    <h1>Knowledge graph</h1>
    <p class="subtitle">Explore how your documents relate to each other. Line thickness reflects how strongly two documents are related.</p>
    <div class="graph-container" id="graph-container">
      <svg id="graph-svg"></svg>
      <div class="connection-popover" id="connection-popover" style="display: none;"></div>
      <div class="graph-controls">
        <button type="button" class="graph-reset-btn" id="graph-reset-edits-btn" title="Revert all committed relatedness edits">Reset edits</button>
        <button type="button" class="graph-reset-btn" id="graph-reset-btn" title="Re-center the graph">Reset view</button>
      </div>
      <div class="graph-legend">
        <div class="graph-legend-row"><span class="graph-legend-circle"></span> Circle size = number of connections</div>
        <div class="graph-legend-row"><span class="graph-legend-line"></span> Line thickness/opacity = relatedness strength</div>
      </div>
    </div>
    <p class="empty-state" id="empty-state" style="display: none;"></p>
  </div>
  </div>

  <script src="/theme.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    (async function () {
      const containerEl = document.getElementById("graph-container");
      const svgEl = document.getElementById("graph-svg");
      const emptyStateEl = document.getElementById("empty-state");
      const popoverEl = document.getElementById("connection-popover");
      popoverEl.addEventListener("click", (event) => event.stopPropagation());

      const RELATEDNESS_THRESHOLD = 0.35;

      function showEmpty(message) {
        containerEl.style.display = "none";
        emptyStateEl.textContent = message;
        emptyStateEl.style.display = "block";
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function truncate(name, max = 22) {
        if (!name) return "";
        return name.length > max ? name.slice(0, max - 1) + "…" : name;
      }

      function toGraph(pairs) {
        const nodeMap = new Map();
        const links = [];

        function ensureNode(id, name) {
          if (!nodeMap.has(id)) {
            nodeMap.set(id, { id, name, degree: 0 });
          }
        }

        for (const pair of pairs) {
          ensureNode(pair.doc_id, pair.file_name);
          ensureNode(pair.related_doc_id, pair.related_file_name);

          const sharedTopics = pair.shared_topics || [];
          if (!sharedTopics.length && pair.score < RELATEDNESS_THRESHOLD) continue;

          nodeMap.get(pair.doc_id).degree++;
          nodeMap.get(pair.related_doc_id).degree++;
          links.push({
            source: pair.doc_id,
            target: pair.related_doc_id,
            value: pair.score,
            sharedTopics,
            sharedRelations: pair.shared_relations || [],
          });
        }

        return { nodes: [...nodeMap.values()], links };
      }

      function renderGraph(nodes, links, initialOverrides = {}) {
        const nodeCount = nodes.length;
        const heightFraction = d3.scaleLinear().domain([2, 50]).range([0.55, 0.85]).clamp(true);
        const targetHeight = Math.max(480, window.innerHeight * heightFraction(nodeCount));
        containerEl.style.height = `${targetHeight}px`;

        const width = svgEl.clientWidth;
        const height = svgEl.clientHeight;

        const maxDegree = d3.max(nodes, (d) => d.degree) || 1;
        const radiusFactorScale = d3.scaleLinear().domain([600, 1400]).range([0.85, 1.4]).clamp(true);
        const radiusFactor = radiusFactorScale(Math.min(window.innerWidth, window.innerHeight));
        const radiusScale = d3
          .scaleSqrt()
          .domain([0, maxDegree])
          .range([10 * radiusFactor, 26 * radiusFactor])
          .clamp(true);
        nodes.forEach((d) => { d.r = radiusScale(d.degree); }); // fixed per node; reused by circle, label, collide, clamp, seed
        const radius = (d) => d.r;

        function seedPositions() {
          const goldenAngle = Math.PI * (3 - Math.sqrt(5));
          const avgRadius = d3.mean(nodes, radius) || 20;
          const spacing = avgRadius * 2.2;
          const idealRadius = spacing * Math.sqrt(nodes.length / Math.PI);
          const discRadius = Math.min(idealRadius, Math.max(Math.min(width, height) / 2 - (avgRadius + 16), 40));

          nodes.forEach((node, i) => {
            const r = discRadius * Math.sqrt((i + 0.5) / nodes.length);
            const theta = i * goldenAngle;
            node.x = width / 2 + r * Math.cos(theta);
            node.y = height / 2 + r * Math.sin(theta);
            node.fx = null;
            node.fy = null;
          });
        }

        const linkDistanceScale = d3.scaleSqrt().domain([1, 1225]).range([240, 650]).clamp(true);
        const chargeScale = d3.scaleLinear().domain([2, 50]).range([-420, -1600]).clamp(true);
        const linkDistance = linkDistanceScale(links.length);
        const chargeStrength = chargeScale(nodeCount);

        const scoreExtent = d3.extent(links, (d) => d.value);
        const domainMin = Math.min(RELATEDNESS_THRESHOLD, scoreExtent[0]);
        const domainMax = scoreExtent[0] === scoreExtent[1] ? scoreExtent[0] + 0.01 : scoreExtent[1];
        const strokeScale = d3.scaleLinear().domain([domainMin, domainMax]).range([1, 8]).clamp(true);
        const opacityScale = d3.scaleLinear().domain([domainMin, domainMax]).range([0.35, 0.95]).clamp(true);

        const svg = d3.select(svgEl);
        const zoomLayer = svg.append("g").attr("class", "zoom-layer");
        const entranceLayer = zoomLayer.append("g").attr("class", "entrance-layer");
        const linkGroup = entranceLayer.append("g").attr("class", "links");
        const nodeGroup = entranceLayer.append("g").attr("class", "nodes");

        const zoomBehavior = d3
          .zoom()
          .scaleExtent([0.3, 4])
          .on("zoom", (event) => zoomLayer.attr("transform", event.transform));
        svg.call(zoomBehavior);

        // A link's displayed strength is its computed score unless the user has
        // tweaked it (session-only override lives on the link object as `override`).
        const MIN_STROKE = 1; // px  -- floor so a low edit stays a visible hairline
        const MIN_OPACITY = 0.35; //  -- floor so a low edit stays visible
        const linkValue = (d) => (d.override != null ? d.override : d.value);
        function applyLinkVisual(sel) {
          sel
            .attr("stroke-width", (d) => Math.max(MIN_STROKE, strokeScale(linkValue(d))))
            .attr("stroke-opacity", (d) => Math.max(MIN_OPACITY, opacityScale(linkValue(d))));
        }

        function joinLinks(className) {
          return linkGroup.selectAll(`line.${className}`).data(links).join("line").attr("class", className);
        }
        const linkSel = joinLinks("graph-link");
        applyLinkVisual(linkSel);

        let pinned = null; // { type: "link"|"node", data } | null

        const linkHitSel = joinLinks("graph-link-hit")
          .on("mouseenter", (event, d) => highlightForLink(d))
          .on("mouseleave", applyPinned)
          .on("click", (event, d) => {
            event.stopPropagation();
            pinned = { type: "link", data: d };
            highlightForLink(d);
            showConnectionPopover(event, d);
          });

        const nodeSel = nodeGroup
          .selectAll("g.node")
          .data(nodes)
          .join("g")
          .attr("class", "node")
          .on("mouseenter", (event, d) => highlightForNode(d))
          .on("mouseleave", applyPinned)
          .on("click", (event, d) => {
            event.stopPropagation();
            pinned = { type: "node", data: d };
            highlightForNode(d);
            showNodePopover(event, d);
          });

        nodeSel.append("circle").attr("class", "graph-node-circle").attr("r", radius);
        nodeSel.append("title").text((d) => d.name);
        nodeSel
          .append("text")
          .attr("class", "graph-node-label")
          .attr("dy", (d) => radius(d) + 14)
          .attr("text-anchor", "middle")
          .text((d) => truncate(d.name));

        nodeSel.each(function (d) {
          d.labelHalfWidth = this.querySelector(".graph-node-label").getBBox().width / 2;
        });

        // Wide, short container: pull harder vertically, softer horizontally, so a
        // weakly-connected node drifts into the roomy left/right margins instead of
        // shooting off the short top/bottom edge. Clamp the ratio so extreme aspect
        // ratios can't make one axis pathologically weak.
        const aspect = Math.min(Math.max(width / height, 1), 2.5);
        const centerStrength = 0.03;
        const strengthX = centerStrength / Math.sqrt(aspect);
        const strengthY = centerStrength * Math.sqrt(aspect);

        // Leaf/near-isolated nodes get pinned toward the vertical midline so their one
        // long link can only stretch them out to the left/right (into the wide side
        // margins) rather than off the short top/bottom edge. Well-connected hubs keep
        // the gentle base centering so the cluster isn't flattened.
        const vPinScale = d3.scaleLinear().domain([1, 4]).range([0.30, strengthY]).clamp(true);

        const simulation = d3
          .forceSimulation(nodes)
          .alphaDecay(0.015)
          .velocityDecay(0.55)
          .force("link", d3.forceLink(links).id((d) => d.id).distance(linkDistance))
          .force("charge", d3.forceManyBody().strength(chargeStrength).distanceMin(30))
          .force("x", d3.forceX(width / 2).strength(strengthX))
          .force("y", d3.forceY(height / 2).strength((d) => vPinScale(d.degree)))
          .force(
            "collide",
            d3.forceCollide((d) => Math.max(radius(d) + 16, (d.labelHalfWidth || 0) + 10)).iterations(2)
          )
          .on("tick", ticked);

        nodeSel.call(drag(simulation));
        simulation.stop(); // deploy() drives the layout; don't paint the un-settled seed

        function clampNodes() {
          nodes.forEach((d) => {
            const padX = Math.max(radius(d), d.labelHalfWidth || 0) + 6;
            const padTop = radius(d) + 6;
            const padBottom = radius(d) + 22; // label sits below the circle
            d.x = Math.max(padX, Math.min(width - padX, d.x));
            d.y = Math.max(padTop, Math.min(height - padBottom, d.y));
          });
        }
        function positionLine(sel) {
          sel
            .attr("x1", (d) => d.source.x)
            .attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x)
            .attr("y2", (d) => d.target.y);
        }
        function draw() {
          positionLine(linkSel);
          positionLine(linkHitSel);
          nodeSel.attr("transform", (d) => `translate(${d.x},${d.y})`);
        }
        function ticked() { clampNodes(); draw(); } // live path (drags) still clamps + paints

        function entranceTransform(s) {
          const cx = width / 2, cy = height / 2;
          return `translate(${cx},${cy}) scale(${s}) translate(${-cx},${-cy})`;
        }
        function deploy() {
          seedPositions();
          simulation.alpha(1).stop();
          // Cool to a near-settled alpha rather than all the way to alphaMin (~457 ticks):
          // the layout is visually converged well before then, so this drops ~40% of the
          // per-tick force work with no visible difference. collide.iterations(2) still
          // runs each tick, so overlap stays resolved.
          const SETTLE_ALPHA = 0.02;
          const ticks = Math.ceil(Math.log(SETTLE_ALPHA) / Math.log(1 - simulation.alphaDecay()));
          for (let i = 0; i < ticks; i++) { simulation.tick(); clampNodes(); } // settle, no paint
          draw(); // paint final layout once
          entranceLayer
            .interrupt()
            .attr("opacity", 0)
            .attr("transform", entranceTransform(0.94))
            .transition().duration(600).ease(d3.easeCubicOut)
            .attr("opacity", 1)
            .attrTween("transform", () => {
              const i = d3.interpolateNumber(0.94, 1);
              return (t) => entranceTransform(i(t));
            });
        }

        // Committed relatedness overrides (server-side), keyed "docA::docB".
        // Seeded from the initial load so the popover "Applied ✓" badge and the
        // drawn graph both reflect edits the user previously applied to search.
        let overridesMap = initialOverrides || {};
        const pairKey = (a, b) => (a <= b ? `${a}::${b}` : `${b}::${a}`);
        // A link's source/target are string ids until the force sim resolves
        // them to node objects, and node objects afterwards -- handle both.
        const linkEndId = (x) => (x && typeof x === "object" ? x.id : x);
        async function refreshOverrides() {
          try {
            const r = await fetch("/documents/relatedness/overrides");
            if (r.ok) overridesMap = (await r.json()).overrides || {};
          } catch (err) {
            /* leave the cached map as-is on failure */
          }
        }

        // Reflect applied overrides in the drawn graph: linkValue() reads
        // d.override, so seeding it makes edited connections keep their thickness/
        // % across navigation. Runs synchronously before first paint -> no flash.
        function applyOverridesToLinks() {
          links.forEach((l) => {
            const key = pairKey(linkEndId(l.source), linkEndId(l.target));
            if (Object.prototype.hasOwnProperty.call(overridesMap, key)) {
              l.override = overridesMap[key];
            }
          });
          applyLinkVisual(linkSel);
        }
        applyOverridesToLinks();

        // "Reset view" -- only re-centers the layout; leaves edits untouched.
        function resetView() {
          svg.transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity);
          deploy();
        }

        // "Reset edits" -- reverts session slider edits and clears the committed
        // server-side overrides; does NOT move the view.
        async function resetEdits() {
          links.forEach((l) => { delete l.override; });
          applyLinkVisual(linkSel);
          hidePopover(); // close any open editor so it can't linger showing a stale value
          try {
            await fetch("/documents/relatedness/overrides", { method: "DELETE" });
          } catch (err) {
            /* best-effort; the visual reset already happened */
          }
          await refreshOverrides();
        }

        document.getElementById("graph-reset-btn").addEventListener("click", resetView);
        document.getElementById("graph-reset-edits-btn").addEventListener("click", resetEdits);

        function highlightForLink(link) {
          linkSel.classed("dimmed", (d) => d !== link);
          nodeSel.classed("dimmed", (d) => d !== link.source && d !== link.target);
        }

        function highlightForNode(node) {
          linkSel.classed("dimmed", (d) => d.source !== node && d.target !== node);
          nodeSel.classed(
            "dimmed",
            (d) =>
              d !== node &&
              !links.some(
                (l) =>
                  (l.source === node && l.target === d) ||
                  (l.target === node && l.source === d)
              )
          );
        }

        function applyPinned() {
          if (!pinned) {
            linkSel.classed("dimmed", false);
            nodeSel.classed("dimmed", false);
          } else if (pinned.type === "link") {
            highlightForLink(pinned.data);
          } else {
            highlightForNode(pinned.data);
          }
        }

        function truncateText(text, max = 100) {
          if (!text) return "";
          return text.length > max ? text.slice(0, max - 1) + "…" : text;
        }

        function renderTopics(topics, options = {}) {
          const emptyMessage = options.emptyMessage || "No obvious shared topics";
          const sectionTitle = options.sectionTitle || "Shared topics";
          if (!topics.length) {
            return `<p class="connection-popover-topics">${escapeHtml(emptyMessage)}</p>`;
          }
          const items = topics
            .map((t) => {
              const typeText = t.entity_type ? ` <span class="connection-popover-topic-type">(${escapeHtml(t.entity_type)})</span>` : "";
              const descText = t.description
                ? `<span class="connection-popover-topic-desc">${escapeHtml(truncateText(t.description))}</span>`
                : "";
              return `<p class="connection-popover-topic"><span class="connection-popover-topic-name">${escapeHtml(t.name)}</span>${typeText}${descText}</p>`;
            })
            .join("");
          return `<p class="connection-popover-section-title">${escapeHtml(sectionTitle)}</p>${items}`;
        }

        function renderRelations(relations) {
          if (!relations.length) return "";
          const items = relations
            .map((r) => {
              const descText = r.description
                ? `<span class="connection-popover-relation-desc">${escapeHtml(truncateText(r.description))}</span>`
                : "";
              return `<p class="connection-popover-relation"><span class="connection-popover-relation-pair">${escapeHtml(r.source)} &rarr; ${escapeHtml(r.target)}</span>${descText}</p>`;
            })
            .join("");
          return `<p class="connection-popover-section-title">How they connect</p>${items}`;
        }

        function renderPopoverShell(bodyHtml) {
          popoverEl.innerHTML = `<button type="button" class="connection-popover-close" aria-label="Close">&times;</button>${bodyHtml}`;
          popoverEl.querySelector(".connection-popover-close").addEventListener("click", (e) => {
            e.stopPropagation();
            hidePopover();
          });
        }

        function positionPopover(event) {
          popoverEl.style.display = "block";
          const rect = containerEl.getBoundingClientRect();
          const clickX = event.clientX - rect.left;
          const clickY = event.clientY - rect.top;
          const maxLeft = rect.width - popoverEl.offsetWidth - 8;
          const maxTop = rect.height - popoverEl.offsetHeight - 8;
          popoverEl.style.left = `${Math.max(8, Math.min(clickX + 12, maxLeft))}px`;
          popoverEl.style.top = `${Math.max(8, Math.min(clickY + 12, maxTop))}px`;
        }

        function showConnectionPopover(event, d) {
          const pct = Math.round(linkValue(d) * 100);
          const applied = Object.prototype.hasOwnProperty.call(
            overridesMap, pairKey(d.source.id, d.target.id)
          );
          renderPopoverShell(`
            <p class="connection-popover-title">${escapeHtml(d.source.name)} &harr; ${escapeHtml(d.target.name)}</p>
            <div class="connection-popover-edit">
              <input type="range" class="connection-popover-slider" min="0" max="100" step="1" value="${pct}" aria-label="Relatedness percent" />
              <input type="text" class="connection-popover-number" inputmode="numeric" maxlength="3" autocomplete="off" value="${pct}" aria-label="Relatedness percent" />
              <span class="connection-popover-score">% related</span>
            </div>
            <button type="button" class="connection-popover-apply${applied ? " applied" : ""}">${applied ? "Applied ✓" : "Apply to search"}</button>
            ${renderTopics(d.sharedTopics)}
            ${renderRelations(d.sharedRelations)}
          `);

          const sliderEl = popoverEl.querySelector(".connection-popover-slider");
          const numberEl = popoverEl.querySelector(".connection-popover-number");
          const applyBtn = popoverEl.querySelector(".connection-popover-apply");

          // Keep only a leading run of digits, clamped to 0-100. Rejects letters,
          // signs, decimals, exponents, whitespace and pasted junk without ever
          // producing NaN. Returns null when there's no usable number.
          function sanitizePct(raw) {
            const match = String(raw).match(/\d+/);
            if (!match) return null;
            return Math.min(100, parseInt(match[0], 10));
          }

          // Commit a clamped percent (0-100) to this one link and redraw it. It
          // deliberately does NOT re-run toGraph / re-filter `links` / remove DOM, so a
          // connection dragged below the 0.35 threshold stays on screen (see
          // MIN_STROKE/MIN_OPACITY).
          function commitPct(pctValue) {
            const next = Math.max(0, Math.min(100, pctValue));
            d.override = next / 100;
            applyLinkVisual(linkSel.filter((l) => l === d));
            // Editing the value un-commits the shown "Applied" state until re-applied.
            applyBtn.classList.remove("applied");
            applyBtn.textContent = "Apply to search";
            return next;
          }

          // Slider is always numeric: apply directly and mirror into the number box.
          sliderEl.addEventListener("input", (e) => {
            const next = commitPct(Math.round(Number(e.target.value)) || 0);
            numberEl.value = String(next);
          });

          // Number box: strip improper characters live so they never persist. An
          // empty/all-invalid value is left alone (no override change) so the user can
          // clear and retype; blur restores a valid value.
          numberEl.addEventListener("input", (e) => {
            const pctValue = sanitizePct(e.target.value);
            if (pctValue === null) {
              e.target.value = "";
              return;
            }
            const next = commitPct(pctValue);
            e.target.value = String(next);
            sliderEl.value = String(next);
          });
          numberEl.addEventListener("blur", () => {
            if (sanitizePct(numberEl.value) === null) {
              numberEl.value = String(Math.round(linkValue(d) * 100));
            }
          });

          // Commit this connection's current value to the server so it biases queries.
          applyBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            if (applyBtn.classList.contains("applied")) return;
            const score = linkValue(d);
            applyBtn.textContent = "Applying…";
            try {
              const r = await fetch("/documents/relatedness/override", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  doc_id: d.source.id,
                  related_doc_id: d.target.id,
                  score,
                }),
              });
              if (!r.ok) throw new Error("request failed");
              overridesMap = (await r.json()).overrides || overridesMap;
              applyBtn.classList.add("applied");
              applyBtn.textContent = "Applied ✓";
            } catch (err) {
              applyBtn.textContent = "Failed — retry";
            }
          });

          positionPopover(event);
        }

        async function showNodePopover(event, node) {
          renderPopoverShell(`
            <p class="connection-popover-title">${escapeHtml(node.name)}</p>
            <p class="connection-popover-topics">Loading topics…</p>
          `);
          positionPopover(event);

          let bodyHtml;
          try {
            const response = await fetch(`/documents/${encodeURIComponent(node.id)}/topics`);
            if (!response.ok) throw new Error("request failed");
            const data = await response.json();
            bodyHtml = renderTopics(data.topics || [], {
              emptyMessage: "No topics extracted for this document",
              sectionTitle: "Topics",
            });
          } catch (err) {
            bodyHtml = '<p class="connection-popover-topics">Could not load topics.</p>';
          }

          // The user may have clicked something else before this fetch resolved --
          // don't clobber whatever popover is showing now with a stale result.
          if (!pinned || pinned.type !== "node" || pinned.data !== node) return;
          renderPopoverShell(`
            <p class="connection-popover-title">${escapeHtml(node.name)}</p>
            ${bodyHtml}
          `);
        }

        function hidePopover() {
          if (popoverEl.style.display === "none") return;
          popoverEl.style.display = "none";
          pinned = null;
          applyPinned();
        }

        document.addEventListener("click", hidePopover);
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") hidePopover();
        });

        function drag(sim) {
          function dragstarted(event, d) {
            if (!event.active) sim.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
          }
          function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
          }
          function dragended(event, d) {
            if (!event.active) sim.alphaTarget(0);
          }
          return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
        }

        deploy();
      }

      let pairs;
      try {
        const response = await fetch("/documents/relatedness");
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.detail || `Request failed (${response.status})`);
        }
        pairs = await response.json();
      } catch (err) {
        showEmpty("Could not load the knowledge graph. Try refreshing the page.");
        return;
      }

      if (!pairs.length) {
        showEmpty("Not enough documents yet — upload at least two to see relationships.");
        return;
      }

      // Load any persisted (applied) relatedness overrides so the graph renders
      // with the user's edits instead of the raw computed scores. Non-fatal.
      let initialOverrides = {};
      try {
        const r = await fetch("/documents/relatedness/overrides");
        if (r.ok) initialOverrides = (await r.json()).overrides || {};
      } catch (err) {
        /* no saved overrides / offline -- fall back to computed scores */
      }

      const { nodes, links } = toGraph(pairs);
      renderGraph(nodes, links, initialOverrides);
    })();
  </script>
</body>
</html>
