<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG-Anything Visualize</title>
<script>
  (function () {
    const saved = localStorage.getItem("ragTheme");
    const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  .graph-container {
    position: relative;
    width: 100%;
    height: 70vh;
    min-height: 480px;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    background: var(--surface-subtle);
    overflow: hidden;
  }
  .connection-popover {
    position: absolute;
    max-width: 320px;
    max-height: 320px;
    overflow-y: auto;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    box-shadow: var(--card-shadow);
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    z-index: 20;
  }
  .connection-popover-section-title {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-faint);
    margin: 10px 0 4px;
  }
  .connection-popover-topic {
    margin: 0 0 6px;
  }
  .connection-popover-topic-name {
    font-weight: 600;
    color: var(--text);
  }
  .connection-popover-topic-type {
    color: var(--text-faint);
    font-weight: 400;
  }
  .connection-popover-topic-desc,
  .connection-popover-relation-desc {
    color: var(--text-muted);
    display: block;
  }
  .connection-popover-relation {
    margin: 0 0 6px;
  }
  .connection-popover-relation-pair {
    font-weight: 600;
    color: var(--text);
  }
  .connection-popover-close {
    position: absolute;
    top: 4px;
    right: 6px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-faint);
    padding: 2px 4px;
    line-height: 1;
  }
  .connection-popover-close:hover {
    color: var(--text);
  }
  .connection-popover-title {
    font-weight: 600;
    color: var(--text);
    margin: 0 16px 4px 0;
  }
  .connection-popover-score {
    color: var(--blue-dark);
    font-weight: 600;
    margin: 0 0 6px;
  }
  .connection-popover-topics {
    color: var(--text-muted);
    margin: 0;
  }
  #graph-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .graph-legend {
    position: absolute;
    bottom: 10px;
    left: 10px;
    padding: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    font-size: 11px;
    line-height: 1.6;
    color: var(--text-muted);
    pointer-events: none;
    z-index: 5;
  }
  .graph-legend-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .graph-legend-circle {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--blue);
    flex: 0 0 auto;
  }
  .graph-legend-line {
    display: inline-block;
    width: 16px;
    height: 3px;
    border-radius: 2px;
    background: var(--text-secondary);
    flex: 0 0 auto;
  }
  .graph-reset-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-strong);
    cursor: pointer;
    z-index: 5;
    transition: background 0.15s ease;
  }
  .graph-reset-btn:hover {
    background: var(--bg);
  }
  .graph-node-circle {
    fill: var(--blue);
    stroke: var(--surface);
    stroke-width: 2px;
    cursor: grab;
  }
  .graph-node-circle:active {
    cursor: grabbing;
  }
  .graph-link {
    stroke: var(--text-secondary);
    stroke-linecap: round;
    fill: none;
    transition: opacity 0.15s ease;
  }
  .graph-link.dimmed {
    opacity: 0.55;
  }
  .graph-link-hit {
    stroke: transparent;
    stroke-width: 14px;
    cursor: pointer;
  }
  .node {
    transition: opacity 0.15s ease;
  }
  .node.dimmed {
    opacity: 0.55;
  }
  .graph-node-label {
    fill: var(--text-muted);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    pointer-events: none;
    user-select: none;
    paint-order: stroke;
    stroke: var(--surface-subtle);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
  <div class="page">
  <nav class="nav">
    <div class="nav-brand">
      <a href="/" class="brand-icon" title="Home">RAG ▾</a>
      <div class="brand-dropdown">
        <a href="/documents.html">Documents</a>
        <a href="/chat.html">Chat</a>
        <a href="/visualize.html" class="active">Visualize</a>
      </div>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" title="Toggle dark mode">🌙</button>
  </nav>
  <div class="card">
    <h1>Knowledge graph</h1>
    <p class="subtitle">Explore how your documents relate to each other. Line thickness reflects how strongly two documents are related.</p>
    <div class="graph-container" id="graph-container">
      <svg id="graph-svg"></svg>
      <div class="connection-popover" id="connection-popover" style="display: none;"></div>
      <button type="button" class="graph-reset-btn" id="graph-reset-btn" title="Reset view">Reset view</button>
      <div class="graph-legend">
        <div class="graph-legend-row"><span class="graph-legend-circle"></span> Circle size = number of connections</div>
        <div class="graph-legend-row"><span class="graph-legend-line"></span> Line thickness/opacity = relatedness strength</div>
      </div>
    </div>
    <p class="empty-state" id="empty-state" style="display: none;"></p>
  </div>
  </div>

  <script src="/theme.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    (async function () {
      const containerEl = document.getElementById("graph-container");
      const svgEl = document.getElementById("graph-svg");
      const emptyStateEl = document.getElementById("empty-state");
      const popoverEl = document.getElementById("connection-popover");
      popoverEl.addEventListener("click", (event) => event.stopPropagation());

      function showEmpty(message) {
        containerEl.style.display = "none";
        emptyStateEl.textContent = message;
        emptyStateEl.style.display = "block";
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function truncate(name, max = 22) {
        if (!name) return "";
        return name.length > max ? name.slice(0, max - 1) + "…" : name;
      }

      function toGraph(pairs) {
        const nodeMap = new Map();
        const links = [];

        for (const pair of pairs) {
          if (!nodeMap.has(pair.doc_id)) {
            nodeMap.set(pair.doc_id, { id: pair.doc_id, name: pair.file_name, degree: 0 });
          }
          if (!nodeMap.has(pair.related_doc_id)) {
            nodeMap.set(pair.related_doc_id, { id: pair.related_doc_id, name: pair.related_file_name, degree: 0 });
          }
          nodeMap.get(pair.doc_id).degree++;
          nodeMap.get(pair.related_doc_id).degree++;
          links.push({
            source: pair.doc_id,
            target: pair.related_doc_id,
            value: pair.score,
            sharedTopics: pair.shared_topics || [],
            sharedRelations: pair.shared_relations || [],
          });
        }

        return { nodes: [...nodeMap.values()], links };
      }

      function renderGraph(nodes, links) {
        const nodeCount = nodes.length;
        const heightFraction = d3.scaleLinear().domain([2, 50]).range([0.55, 0.85]).clamp(true);
        const targetHeight = Math.max(480, window.innerHeight * heightFraction(nodeCount));
        containerEl.style.height = `${targetHeight}px`;

        const width = svgEl.clientWidth;
        const height = svgEl.clientHeight;

        function seedPositions() {
          const seedRadius = Math.min(width, height) * 0.38;
          nodes.forEach((node, i) => {
            const angle = (2 * Math.PI * i) / nodes.length - Math.PI / 2;
            node.x = width / 2 + seedRadius * Math.cos(angle);
            node.y = height / 2 + seedRadius * Math.sin(angle);
            node.fx = null;
            node.fy = null;
          });
        }
        seedPositions();

        const linkDistanceScale = d3.scaleSqrt().domain([1, 1225]).range([240, 650]).clamp(true);
        const chargeScale = d3.scaleLinear().domain([2, 50]).range([-280, -1100]).clamp(true);
        const linkDistance = linkDistanceScale(links.length);
        const chargeStrength = chargeScale(nodeCount);

        const maxDegree = d3.max(nodes, (d) => d.degree) || 1;
        const radiusScale = d3.scaleSqrt().domain([0, maxDegree]).range([10, 26]).clamp(true);
        const radius = (d) => radiusScale(d.degree);

        const scoreExtent = d3.extent(links, (d) => d.value);
        const domainMin = scoreExtent[0];
        const domainMax = scoreExtent[0] === scoreExtent[1] ? scoreExtent[0] + 0.01 : scoreExtent[1];
        const strokeScale = d3.scaleLinear().domain([domainMin, domainMax]).range([1, 8]).clamp(true);
        const opacityScale = d3.scaleLinear().domain([domainMin, domainMax]).range([0.35, 0.95]).clamp(true);

        const svg = d3.select(svgEl);
        const zoomLayer = svg.append("g").attr("class", "zoom-layer");
        const linkGroup = zoomLayer.append("g").attr("class", "links");
        const nodeGroup = zoomLayer.append("g").attr("class", "nodes");

        const zoomBehavior = d3
          .zoom()
          .scaleExtent([0.3, 4])
          .on("zoom", (event) => zoomLayer.attr("transform", event.transform));
        svg.call(zoomBehavior);

        const linkSel = linkGroup
          .selectAll("line.graph-link")
          .data(links)
          .join("line")
          .attr("class", "graph-link")
          .attr("stroke-width", (d) => strokeScale(d.value))
          .attr("stroke-opacity", (d) => opacityScale(d.value));

        let pinned = null; // { type: "link"|"node", data } | null

        const linkHitSel = linkGroup
          .selectAll("line.graph-link-hit")
          .data(links)
          .join("line")
          .attr("class", "graph-link-hit")
          .on("mouseenter", (event, d) => highlightForLink(d))
          .on("mouseleave", applyPinned)
          .on("click", (event, d) => {
            event.stopPropagation();
            pinned = { type: "link", data: d };
            highlightForLink(d);
            showConnectionPopover(event, d);
          });

        const simulation = d3
          .forceSimulation(nodes)
          .alphaDecay(0.015)
          .force("link", d3.forceLink(links).id((d) => d.id).distance(linkDistance))
          .force("charge", d3.forceManyBody().strength(chargeStrength))
          .force("center", d3.forceCenter(width / 2, height / 2))
          .force("collide", d3.forceCollide((d) => radius(d) + 6))
          .on("tick", ticked);

        const nodeSel = nodeGroup
          .selectAll("g.node")
          .data(nodes)
          .join("g")
          .attr("class", "node")
          .call(drag(simulation))
          .on("mouseenter", (event, d) => highlightForNode(d))
          .on("mouseleave", applyPinned)
          .on("click", (event, d) => {
            event.stopPropagation();
            pinned = { type: "node", data: d };
            highlightForNode(d);
            showNodePopover(event, d);
          });

        nodeSel.append("circle").attr("class", "graph-node-circle").attr("r", radius);
        nodeSel.append("title").text((d) => d.name);
        nodeSel
          .append("text")
          .attr("class", "graph-node-label")
          .attr("dy", (d) => radius(d) + 14)
          .attr("text-anchor", "middle")
          .text((d) => truncate(d.name));

        function ticked() {
          linkSel
            .attr("x1", (d) => d.source.x)
            .attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x)
            .attr("y2", (d) => d.target.y);
          linkHitSel
            .attr("x1", (d) => d.source.x)
            .attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x)
            .attr("y2", (d) => d.target.y);
          nodeSel.attr("transform", (d) => `translate(${d.x},${d.y})`);
        }

        function resetView() {
          svg.transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity);
          seedPositions();
          simulation.alpha(1).restart();
        }

        document.getElementById("graph-reset-btn").addEventListener("click", resetView);

        function highlightForLink(link) {
          linkSel.classed("dimmed", (d) => d !== link);
          nodeSel.classed("dimmed", (d) => d !== link.source && d !== link.target);
        }

        function highlightForNode(node) {
          linkSel.classed("dimmed", (d) => d.source !== node && d.target !== node);
          nodeSel.classed(
            "dimmed",
            (d) =>
              d !== node &&
              !links.some(
                (l) =>
                  (l.source === node && l.target === d) ||
                  (l.target === node && l.source === d)
              )
          );
        }

        function applyPinned() {
          if (!pinned) {
            linkSel.classed("dimmed", false);
            nodeSel.classed("dimmed", false);
          } else if (pinned.type === "link") {
            highlightForLink(pinned.data);
          } else {
            highlightForNode(pinned.data);
          }
        }

        function truncateText(text, max = 100) {
          if (!text) return "";
          return text.length > max ? text.slice(0, max - 1) + "…" : text;
        }

        function renderTopics(topics, options = {}) {
          const emptyMessage = options.emptyMessage || "No obvious shared topics";
          const sectionTitle = options.sectionTitle || "Shared topics";
          if (!topics.length) {
            return `<p class="connection-popover-topics">${escapeHtml(emptyMessage)}</p>`;
          }
          const items = topics
            .map((t) => {
              const typeText = t.entity_type ? ` <span class="connection-popover-topic-type">(${escapeHtml(t.entity_type)})</span>` : "";
              const descText = t.description
                ? `<span class="connection-popover-topic-desc">${escapeHtml(truncateText(t.description))}</span>`
                : "";
              return `<p class="connection-popover-topic"><span class="connection-popover-topic-name">${escapeHtml(t.name)}</span>${typeText}${descText}</p>`;
            })
            .join("");
          return `<p class="connection-popover-section-title">${escapeHtml(sectionTitle)}</p>${items}`;
        }

        function renderRelations(relations) {
          if (!relations.length) return "";
          const items = relations
            .map((r) => {
              const descText = r.description
                ? `<span class="connection-popover-relation-desc">${escapeHtml(truncateText(r.description))}</span>`
                : "";
              return `<p class="connection-popover-relation"><span class="connection-popover-relation-pair">${escapeHtml(r.source)} &rarr; ${escapeHtml(r.target)}</span>${descText}</p>`;
            })
            .join("");
          return `<p class="connection-popover-section-title">How they connect</p>${items}`;
        }

        function renderPopoverShell(bodyHtml) {
          popoverEl.innerHTML = `<button type="button" class="connection-popover-close" aria-label="Close">&times;</button>${bodyHtml}`;
          popoverEl.querySelector(".connection-popover-close").addEventListener("click", (e) => {
            e.stopPropagation();
            hidePopover();
          });
        }

        function positionPopover(event) {
          popoverEl.style.display = "block";
          const rect = containerEl.getBoundingClientRect();
          const clickX = event.clientX - rect.left;
          const clickY = event.clientY - rect.top;
          const maxLeft = rect.width - popoverEl.offsetWidth - 8;
          const maxTop = rect.height - popoverEl.offsetHeight - 8;
          popoverEl.style.left = `${Math.max(8, Math.min(clickX + 12, maxLeft))}px`;
          popoverEl.style.top = `${Math.max(8, Math.min(clickY + 12, maxTop))}px`;
        }

        function showConnectionPopover(event, d) {
          const scoreText = `${Math.round(d.value * 100)}% related`;
          renderPopoverShell(`
            <p class="connection-popover-title">${escapeHtml(d.source.name)} &harr; ${escapeHtml(d.target.name)}</p>
            <p class="connection-popover-score">${scoreText}</p>
            ${renderTopics(d.sharedTopics)}
            ${renderRelations(d.sharedRelations)}
          `);
          positionPopover(event);
        }

        async function showNodePopover(event, node) {
          renderPopoverShell(`
            <p class="connection-popover-title">${escapeHtml(node.name)}</p>
            <p class="connection-popover-topics">Loading topics…</p>
          `);
          positionPopover(event);

          let bodyHtml;
          try {
            const response = await fetch(`/documents/${encodeURIComponent(node.id)}/topics`);
            if (!response.ok) throw new Error("request failed");
            const data = await response.json();
            bodyHtml = renderTopics(data.topics || [], {
              emptyMessage: "No topics extracted for this document",
              sectionTitle: "Topics",
            });
          } catch (err) {
            bodyHtml = '<p class="connection-popover-topics">Could not load topics.</p>';
          }

          // The user may have clicked something else before this fetch resolved --
          // don't clobber whatever popover is showing now with a stale result.
          if (!pinned || pinned.type !== "node" || pinned.data !== node) return;
          renderPopoverShell(`
            <p class="connection-popover-title">${escapeHtml(node.name)}</p>
            ${bodyHtml}
          `);
        }

        function hidePopover() {
          if (popoverEl.style.display === "none") return;
          popoverEl.style.display = "none";
          pinned = null;
          applyPinned();
        }

        document.addEventListener("click", hidePopover);
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") hidePopover();
        });

        function drag(sim) {
          function dragstarted(event, d) {
            if (!event.active) sim.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
          }
          function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
          }
          function dragended(event, d) {
            if (!event.active) sim.alphaTarget(0);
            d.fx = null;
            d.fy = null;
          }
          return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
        }
      }

      let pairs;
      try {
        const response = await fetch("/documents/relatedness");
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.detail || `Request failed (${response.status})`);
        }
        pairs = await response.json();
      } catch (err) {
        showEmpty("Could not load the knowledge graph. Try refreshing the page.");
        return;
      }

      if (!pairs.length) {
        showEmpty("Not enough documents yet — upload at least two to see relationships.");
        return;
      }

      const { nodes, links } = toGraph(pairs);
      renderGraph(nodes, links);
    })();
  </script>
</body>
</html>
